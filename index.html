<style>
  :root{
    --paper:#f2f1ec;
    --ink:#1c2b45;
    --seal:#b5342a;
    --teal:#2f6f5e;
    --amber:#8a5a2b;
    --line:#d8d5c8;
    --card:#ffffff;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Noto Sans KR', sans-serif; }
  .serif{font-family:'Noto Serif KR', serif;}
  .mono{font-family:'IBM Plex Mono', monospace;}
  button{font-family:inherit; cursor:pointer;}
  input, select, textarea{font-family:inherit;}

  #app{ display:flex; min-height:100vh; }

  #sidebar{
    width:220px; flex-shrink:0; background:var(--ink); color:#f2f1ec;
    display:flex; flex-direction:column; padding:24px 0; position:sticky; top:0; height:100vh;
  }
  #sidebar .brand{ padding:0 20px 20px 20px; border-bottom:1px solid rgba(255,255,255,0.15); margin-bottom:12px; }
  #sidebar .brand .eyebrow{ font-size:10px; letter-spacing:0.12em; color:#e0c090; text-transform:uppercase; margin-bottom:6px; }
  #sidebar .brand .title{ font-size:18px; font-weight:700; }
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:11px 20px; font-size:14px;
    color:#d8d9dc; border-left:3px solid transparent; cursor:pointer;
  }
  .nav-item:hover{ background:rgba(255,255,255,0.06); }
  .nav-item.active{ background:rgba(255,255,255,0.09); border-left-color:var(--amber); color:#fff; font-weight:600; }
  .nav-item .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; opacity:0.5; flex-shrink:0; }
  #sidebar .foot{ margin-top:auto; padding:14px 20px 0 20px; font-size:11px; color:#9098a8; border-top:1px solid rgba(255,255,255,0.12); }

  #main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  #topbar{
    background:var(--card); border-bottom:1px solid var(--line); padding:16px 28px;
    display:flex; flex-wrap:wrap; align-items:center; gap:14px; position:sticky; top:0; z-index:20;
  }
  #topbar .page-title{ font-family:'Noto Serif KR', serif; font-weight:700; font-size:20px; margin-right:8px; }
  #topbar .page-desc{ font-size:12px; opacity:0.55; }
  .btn{ border:none; border-radius:6px; padding:8px 16px; font-size:13px; font-weight:600; color:#fff; background:var(--ink); }
  .btn.outline{ background:#fff; color:var(--ink); border:1px solid var(--ink); }
  .btn.amber{ background:var(--amber); }
  .btn:disabled{ opacity:0.5; cursor:default; }
  select.field, input.field, textarea.field{
    border:1px solid var(--line); background:#fff; border-radius:6px; padding:6px 10px; font-size:12px; color:var(--ink);
  }

  #content{ padding:24px 28px 60px 28px; }

  .section-title{ font-family:'Noto Serif KR', serif; font-weight:700; font-size:17px; margin:28px 0 12px 0; }
  .section-title:first-child{ margin-top:0; }
  .section-note{ font-size:12px; opacity:0.55; margin:-6px 0 14px 0; }

  .card{ background:var(--card); border:1px solid var(--line); border-radius:10px; }

  .summary-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:14px; }
  .summary-card{ background:var(--card); border:1px solid var(--line); border-left:4px solid var(--amber); border-radius:10px; padding:16px 18px; }
  .summary-card .label{ font-size:12px; opacity:0.6; margin-bottom:4px; }
  .summary-card .value{ font-family:'IBM Plex Mono', monospace; font-size:22px; font-weight:600; }
  .summary-card .sub{ font-size:11px; opacity:0.5; margin-top:4px; }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); font-size:11px; opacity:0.55; font-weight:600; }
  td{ padding:10px 12px; border-bottom:1px solid var(--line); }
  tr:last-child td{ border-bottom:none; }
  .num{ font-family:'IBM Plex Mono', monospace; text-align:right; }

  .empty-state{ text-align:center; padding:48px 20px; color:var(--ink); opacity:0.55; font-size:13px; }
  .empty-state .big{ font-size:28px; margin-bottom:8px; }

  .badge{ display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600; }
  .badge.roas-good{ background:#e5f0ec; color:var(--teal); }
  .badge.roas-bad{ background:#f8e6e4; color:var(--seal); }

  .form-grid label{ display:flex; flex-direction:column; gap:4px; font-size:11px; opacity:0.65; }

  .banner{ font-size:12px; padding:9px 14px; border-radius:8px; display:inline-block; margin:6px 8px 6px 0; }
  .banner.info{ background:#fdf1e2; color:var(--amber); }
  .banner.ok{ background:#e5f0ec; color:var(--teal); }

    border:1px solid var(--ink); background:#fff; color:var(--ink); cursor:pointer;

  .cal-cell{

  .cal-cell.today{ border-color:var(--amber); box-shadow:0 0 0 1px var(--amber) inset; }
  .cal-daynum{ font-family:'IBM Plex Mono', monospace; font-size:12px; opacity:0.6; }
  .cal-entries{ display:flex; flex-direction:column; gap:3px; flex:1; overflow:hidden; }

  @media (max-width: 1200px){

  @media (max-width: 900px){

    #sidebar{ width:100%; height:auto; position:relative; padding:14px 16px; }
    #sidebar .brand{ display:flex; align-items:center; justify-content:space-between; border-bottom:none; margin-bottom:0; padding:0; }
    .mobile-nav-toggle{ display:inline-block; }
    .sidebar-nav{ display:none; margin-top:14px; }
    .sidebar-nav.open{ display:block; }
    #sidebar .foot{ margin-top:14px; padding:14px 0 0 0; border-top:1px solid rgba(255,255,255,0.12); }
    #content{ padding:16px 14px 40px 14px; }
    #topbar{ padding:12px 16px; gap:8px; }
    #topbar .page-title{ font-size:17px; }
    .modal-box{ padding:16px; }
    .cal-cell{ min-height:76px; padding:4px; }
    .cal-entry{ font-size:10px; }
    table{ font-size:12px; }
  }

     (표를 감싼 카드 중 일부는 overflow:hidden 인라인 스타일이 있어 !important로 덮어씀) */
  @media (max-width: 640px){
    .card{ overflow-x:auto !important; -webkit-overflow-scrolling:touch; }
    table{ min-width:460px; }
  }
</style>

<div id="app"></div>

<script>
/* =========================================================
   저장소: /api/storage (Vercel KV)로 실제 서버에 저장한다.
   기존 window.storage.get/set/delete/list 인터페이스는 그대로 유지해서
   나머지 앱 코드는 손대지 않아도 되게 만든다.
   (shared 파라미터는 이 배포판에서는 팀 전체가 같은 비밀번호를 쓰므로 무시한다)
========================================================= */
function redirectToLogin(){
  window.location.href = "/login.html";
}

function createApiStorage(){
  return {
    async get(key, _shared){
      const res = await fetch("/api/storage?key=" + encodeURIComponent(key));
      if(res.status === 401){ redirectToLogin(); throw new Error("로그인이 필요해요."); }
      if(res.status === 404) return null;
      if(!res.ok){ const d = await res.json().catch(()=>({})); throw new Error(d.error || "저장소 조회 실패"); }
      const data = await res.json(); // { key, value: <원본 객체> }
      // 기존 앱 코드는 항상 JSON.parse(result.value)를 호출하므로, value를 문자열로 되돌려준다.
      return { key: data.key, value: JSON.stringify(data.value) };
    },
    async set(key, value, _shared){
      let parsed;
      try{ parsed = JSON.parse(value); }catch(e){ parsed = value; }
      const res = await fetch("/api/storage", {
        method:"POST", headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ key, value: parsed })
      });
      if(res.status === 401){ redirectToLogin(); throw new Error("로그인이 필요해요."); }
      if(!res.ok){ const d = await res.json().catch(()=>({})); throw new Error(d.error || "저장소 저장 실패"); }
      return { key, value, shared:false };
    },
    async delete(key, _shared){
      const res = await fetch("/api/storage?key=" + encodeURIComponent(key), { method:"DELETE" });
      if(res.status === 401){ redirectToLogin(); throw new Error("로그인이 필요해요."); }
      if(!res.ok){ const d = await res.json().catch(()=>({})); throw new Error(d.error || "저장소 삭제 실패"); }
      return { key, deleted:true };
    },
    async list(prefix, _shared){
      const res = await fetch("/api/storage?list=1&prefix=" + encodeURIComponent(prefix||""));
      if(res.status === 401){ redirectToLogin(); throw new Error("로그인이 필요해요."); }
      if(!res.ok){ const d = await res.json().catch(()=>({})); throw new Error(d.error || "저장소 목록 조회 실패"); }
      return await res.json(); // { keys }
    }
  };
}
window.storage = createApiStorage();

/* =========================================================
   AI 호출: 브라우저는 프롬프트만 서버(/api/ai)로 보내고,
   실제 Anthropic API 키는 서버 환경변수 안에만 있다.
========================================================= */
async function callBackendAI(prompt, useWebSearch, maxTokens, images){
  const res = await fetch("/api/ai", {
    method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ prompt, useWebSearch: !!useWebSearch, maxTokens: maxTokens||2000, images: images||undefined })
  });
  if(res.status === 401){ redirectToLogin(); throw new Error("로그인이 필요해요."); }
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || "AI 요청이 실패했어요.");
  return data.text || "";
}

/* data URL(dataUrl)을 Anthropic Vision API가 받는 {mediaType, data(순수 base64)} 형태로 변환 */
function dataUrlToVisionImage(dataUrl){
  const match = /^data:([^;]+);base64,(.*)$/.exec(dataUrl);
  if(!match) throw new Error("이미지 형식을 읽지 못했어요.");
  return { mediaType: match[1], data: match[2] };
}

/* 재작성된 칼럼을 노션 페이지로 업로드: 실제 Notion API 키는 서버(/api/notion)에만 있다 */
async function callBackendNotion(payload){
  const res = await fetch("/api/notion", {
    method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify(payload)
  });
  if(res.status === 401){ redirectToLogin(); throw new Error("로그인이 필요해요."); }
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || "노션 업로드가 실패했어요.");
  return data.url || "";
}

/* 로그인 여부 확인 후 아니면 로그인 페이지로. 확인되면 앱 로딩 시작 */
async function guardSessionThenStart(){
  try{
    const res = await fetch("/api/session");
    const data = await res.json();
    if(!data.authenticated){ redirectToLogin(); return; }
  }catch(e){
    redirectToLogin(); return;
  }
  loadState();
}



/* =========================================================
   상태
   - products / manualProductEntries: 회계 앱과 "같은 키"를 읽고 쓴다
     (같은 계정에서 storage가 공유된다면 자동 연동, 아니라면
      연동 설정 탭의 JSON 가져오기로 스냅샷을 맞춰준다)
   - mkt:* 로 시작하는 키는 이 도구 전용 데이터
========================================================= */

  campaigns: [],       // [{id, product, channel, name, startDate, endDate, budget, status}]

  contentPlans: [],    // [{id, dateStr, title, product, contentType, planDetail, actualDetail, status:"plan"|"posted"|"event", linkedEventId, createdAt}]
  monthlyPlans: {},    // { "YYYY-MM": { goal:"", events:[{id, title, deadlineDateStr, memo, createdAt}] } }
  calendarYear: new Date().getFullYear(),
  calendarMonth: new Date().getMonth()+1, // 1~12
  modal: null,          // { mode:"create"|"edit", dateStr, entryId }
  cardEditor: null,     // { slideIdx, selectedLayer, imageSearch } — 카드뉴스 카드를 눌러 확대 편집할 때 열리는 모달 상태

  columnProjects: [],   // 저장된 프로젝트: [{id, title, rewrittenColumn, reelsScript, createdAt}]
  brandSettings: { orgName:"", phone:"", tagline:"", kicker:"" },  // 카드뉴스에 들어갈 사무소 정보 (kicker: 카드 상단에 뜨는 시리즈 라벨)

  cardNewsPrompt: "",    // 카드뉴스 전용 스타일/톤/구성 프롬프트 (카드뉴스 대본 생성시에만 반영)

/* 보관함에 넣을 이미지는 용량 절약을 위해 긴 변 기준 960px로 줄이고 JPEG로 압축한다.
   실제로 카드에 넣는 원본 이미지(makeImageLayer 등)는 손대지 않고, 보관함 저장본만 줄인다. */
function downscaleImageForLibrary(dataUrl, maxDim, quality){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>{
      try{
        const scale = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.max(1, Math.round(img.naturalWidth * scale));
        const h = Math.max(1, Math.round(img.naturalHeight * scale));
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      }catch(e){ resolve(dataUrl); }
    };
    img.onerror = ()=> resolve(dataUrl);
    img.src = dataUrl;
  });
}

const IMAGE_LIBRARY_MAX_ITEMS = 40;

  state.imageLibrary.unshift({

async function analyzeDesignReference(){
  const dr = state.designReference;
  if(dr.loading) return;
  if(!dr.images.length){ dr.error = "먼저 참고할 카드뉴스 디자인 이미지를 1장 이상 올려주세요."; render(); return; }
  dr.loading = true; dr.error = ""; dr.lastNote = "";
  render();
  try{
    const prompt = `너는 인스타그램 카드뉴스(세로형 슬라이드 이미지 콘텐츠) 디자이너야.
첨부된 이미지는 사용자가 앞으로 만들 카드뉴스가 닮았으면 하는 참고 디자인이야.
이 이미지의 배경색·글자색·포인트색, 타이포그래피(굵기/폰트 느낌), 여백·레이아웃, 전체 무드를 분석해서
아래 JSON 형식으로만 답변해. 다른 설명이나 마크다운 코드블록 없이 JSON 객체 하나만 출력해.

{
  "coverBg": "#RRGGBB",
  "coverText": "#RRGGBB",
  "contentBg": "#RRGGBB",
  "contentText": "#RRGGBB",
  "ctaBg": "#RRGGBB",
  "ctaText": "#RRGGBB",
  "accent": "#RRGGBB",
  "styleNote": "이 디자인의 느낌을 카드뉴스 생성 프롬프트에 바로 쓸 수 있게 한국어 3~5문장으로 구체적으로 설명 (예: 여백을 넉넉하게 쓰고 문장은 짧게 끊는다, 세리프 계열의 묵직한 헤드라인, 포인트 색은 밑줄이나 박스로만 절제해서 쓴다 등)"
}

색상은 이미지에서 실제로 관찰되는 색을 최대한 정확한 hex 코드로 추정해줘.
표지(cover)/본문(content)/CTA(마지막 장) 배경이 이미지 안에서 서로 다르게 보이면 그 차이를 반영하고,
구분이 안 되면 전체적으로 일관된 색을 같은 값으로 줘도 돼.`;

    const images = dr.images.map(dataUrlToVisionImage);
    const text = await callBackendAI(prompt, false, 900, images);
    const parsed = extractJSONBlock(text);

    const colorKeys = ["coverBg","coverText","contentBg","contentText","ctaBg","ctaText","accent"];
    const newPreset = { ...defaultCardColors() };
    colorKeys.forEach(k=>{ if(parsed[k] && /^#[0-9a-fA-F]{6}$/.test(parsed[k])) newPreset[k] = parsed[k]; });
    state.cardColorPresets = newPreset;

    const styleNote = String(parsed.styleNote || "").trim();
    if(styleNote){
      state.cardNewsPrompt = (state.cardNewsPrompt ? state.cardNewsPrompt.trim() + "\n\n" : "") + "[레퍼런스 디자인 분석] " + styleNote;
    }
    await saveCardColorPresets();
    await saveCardNewsPrompt();
    dr.lastNote = styleNote || "색상 팔레트를 적용했어요.";
  }catch(e){
    dr.error = "분석에 실패했어요: " + e.message;
  }
  dr.loading = false;
  render();
}

/* =========================================================
   ★ 핵심 연동 지점 ★
   마케팅비를 입력하면 회계 앱의 manualProductEntries 포맷과
   완전히 동일한 항목을 만들어 push한다.
   → 회계 앱을 열면 해당 상품의 "비용내역"에 그대로 잡힌다.
========================================================= */
async function pushSpendToAccounting(productName, amount, memo, dateStr){
  if(!productName || !amount) return;
  if(!state.manualProductEntries[productName]) state.manualProductEntries[productName] = [];
  const entry = {
    id: "manual-"+Date.now()+"-"+Math.random().toString(36).slice(2,7),
    type: "expense",
    amount: Number(amount),
    memo: "[마케팅] " + (memo||"").trim(),
    dateStr: dateStr,
    createdAt: new Date().toISOString(),
  };
  state.manualProductEntries[productName].push(entry);
  await window.storage.set("manualProductEntries", JSON.stringify(state.manualProductEntries), false);
}

   지표 계산 (틀만 — 실제 캠페인/지출 데이터가 쌓이면 채워짐)
========================================================= */
function metricsForProduct(productName){
  const spends = state.adSpends.filter(s => {
    const camp = state.campaigns.find(c => c.id === s.campaignId);
    return camp && camp.product === productName;
  });
  const totalSpend = spends.reduce((sum,s)=>sum+(s.spend||0), 0);
  const totalClicks = spends.reduce((sum,s)=>sum+(s.clicks||0), 0);
  const totalImpr = spends.reduce((sum,s)=>sum+(s.impressions||0), 0);
  const totalRevenue = spends.reduce((sum,s)=>sum+(s.revenue||0), 0);
  return {
    spend: totalSpend,
    clicks: totalClicks,
    impressions: totalImpr,
    revenue: totalRevenue,
    cpc: totalClicks>0 ? totalSpend/totalClicks : null,
    ctr: totalImpr>0 ? totalClicks/totalImpr : null,
    roas: totalSpend>0 ? totalRevenue/totalSpend : null,
  };
}

function fmtWon(n){ return "₩" + Math.round(n||0).toLocaleString("ko-KR"); }
function fmtPct(n){ return n==null ? "—" : (n*100).toFixed(1)+"%"; }
function fmtRoas(n){ return n==null ? "—" : n.toFixed(2)+"x"; }

  // 스크롤 위치를 그대로 복원해서 고친다.
  const scrollBefore = document.scrollingElement ? document.scrollingElement.scrollTop : (document.documentElement.scrollTop || document.body.scrollTop);
  // 카드 확대 편집 모달의 오른쪽 패널(#card-editor-panel)은 자체적으로 스크롤되는 영역이라

  const panelScrollBefore = panelBefore ? panelBefore.scrollTop : null;
  app.innerHTML = `
    <div id="sidebar">
      <div class="brand">
        <div>
          <div class="eyebrow">Marketing Ops</div>
          <div class="title serif">마케팅 성과 도구</div>

        ${NAV.map(n => `
          <div class="nav-item ${state.route===n.key?'active':''}" data-route="${n.key}">
            <span class="dot"></span>${n.label}
          </div>
        `).join("")}
      </div>

      </div>
      <div id="content">
        ${routeContent()}
      </div>
    </div>
  `;
  document.querySelectorAll(".nav-item").forEach(el=>{
    el.addEventListener("click", ()=>{ state.route = el.dataset.route; state.mobileNavOpen = false; render(); });
  });
  const mobileNavToggle = document.getElementById("mobile-nav-toggle");
  if(mobileNavToggle) mobileNavToggle.addEventListener("click", ()=>{ state.mobileNavOpen = !state.mobileNavOpen; render(); });
  const logoutBtn = document.getElementById("logout-btn");
  if(logoutBtn) logoutBtn.addEventListener("click", async ()=>{
    try{ await fetch("/api/logout", { method:"POST" }); }catch(e){}
    redirectToLogin();
  });
  bindRouteEvents();
  if(document.scrollingElement) document.scrollingElement.scrollTop = scrollBefore;
  else { document.documentElement.scrollTop = scrollBefore; document.body.scrollTop = scrollBefore; }
  if(panelScrollBefore != null){

    if(panelAfter) panelAfter.scrollTop = panelScrollBefore;
  }
}

function routeContent(){

function renderProducts(){

function renderCalendarGrid(year, month){
  const nDays = daysInMonth(year, month);
  const startWeekday = firstWeekday(year, month);
  const cells = [];
  for(let i=0;i<startWeekday;i++) cells.push(null);
  for(let d=1; d<=nDays; d++) cells.push(d);
  while(cells.length % 7 !== 0) cells.push(null);

  const todayIso = todayStr();

  let html = `<div class="cal-grid">`;
  WEEKDAY_LABELS.forEach(w => html += `<div class="cal-head">${w}</div>`);
  cells.forEach(d=>{
    if(d===null){ html += `<div class="cal-cell empty"></div>`; return; }
    const dateStr = year+"-"+pad2(month)+"-"+pad2(d);
    const entries = plansForDate(dateStr);
    const isToday = dateStr===todayIso;
    html += `
      <div class="cal-cell ${isToday?'today':''}" data-date="${dateStr}">
        <div class="cal-daynum">${d}</div>
        <div class="cal-entries">
          ${entries.map(e=>`
            <div class="cal-entry ${e.status}" data-edit-entry="${e.id}">
              ${e.status==="posted" ? "✅ " : (e.status==="event" ? "" : "📝 ")}${e.title}
            </div>
          `).join("")}
        </div>
        <div class="cal-add" data-add-date="${dateStr}">+ 계획 추가</div>
      </div>
    `;
  });
  html += `</div>`;
  return html;
}

/* ---- 초안 자동 복구: 실수로 새로고침해도 작업 중이던 칼럼 입력이 로컬(이 브라우저)에 남아있으면 복구할 수 있게 ----
   저장된 프로젝트(projectId 있음)를 편집 중일 때는 별도 초안을 만들지 않는다 (이미 서버에 저장되고 있으므로 중복 불필요) */
const COLUMN_DRAFT_KEY = "mkt:columnDraftV1";

function saveColumnDraftToStorage(){
  try{
    const p = state.pipeline;
    if(p.projectId){ localStorage.removeItem(COLUMN_DRAFT_KEY); return; }
    if(!p.sourceText && !p.sourceUrl && !p.rewrittenColumn){ localStorage.removeItem(COLUMN_DRAFT_KEY); return; }
    localStorage.setItem(COLUMN_DRAFT_KEY, JSON.stringify({
      inputMode: p.inputMode, sourceUrl: p.sourceUrl, sourceText: p.sourceText,
      rewrittenColumn: p.rewrittenColumn, savedAt: Date.now(),
    }));
  }catch(e){}
}

function readColumnDraftFromStorage(){
  try{
    const raw = localStorage.getItem(COLUMN_DRAFT_KEY);
    if(!raw) return null;
    const draft = JSON.parse(raw);
    if(!draft || (!draft.sourceText && !draft.sourceUrl && !draft.rewrittenColumn)) return null;
    if(Date.now() - (draft.savedAt||0) > 1000*60*60*24*14) return null; // 2주 지난 초안은 무시
    return draft;
  }catch(e){ return null; }
}

function clearColumnDraftFromStorage(){
  try{ localStorage.removeItem(COLUMN_DRAFT_KEY); }catch(e){}
}

function restoreColumnDraft(){
  const draft = readColumnDraftFromStorage();
  if(!draft) return;
  const p = state.pipeline;
  p.inputMode = draft.inputMode || "text";
  p.sourceUrl = draft.sourceUrl || "";
  p.sourceText = draft.sourceText || "";
  p.rewrittenColumn = draft.rewrittenColumn || null;
  clearColumnDraftFromStorage();
  render();
}

function formatCharCountNote(body){
  const n = (body||"").length;
  const min = Math.max(1, Math.round(n/400)); // 한글 기준 분당 약 400자 읽기 속도로 추정
  return `글자 수 ${n.toLocaleString("ko-KR")}자 · 약 ${min}분 읽기`;
}

/* 변호사 광고 규정 위반 소지가 있는 표현을 텍스트에서 찾아준다 (완벽한 법률 검토를 대체하지 않음 — 참고용 1차 점검) */
const AD_RISK_PHRASES = [
  "100% 승소", "승소 보장", "무조건 승소", "반드시 승소", "승소율 100",
  "전액 환급 보장", "합의금 보장", "국내 최고", "국내 1위", "업계 1위",
  "최고의 로펌", "최고의 변호사", "최다 승소", "승소 전문",
];
function scanAdRiskPhrases(text){
  const t = String(text||"");
  return AD_RISK_PHRASES.filter(p => t.includes(p));
}
function formatAdRiskWarning(text){
  const found = scanAdRiskPhrases(text);
  if(!found.length) return "";
  return `<div class="banner" style="background:#f8e6e4;color:var(--seal);display:block;">⚠️ 광고 규정 위반 소지 표현이 발견됐어요: ${found.map(f=>`<b>"${escapeHtml(f)}"</b>`).join(", ")} — 발행 전 표현을 다듬거나 지방변호사회 광고심사를 확인하세요.</div>`;
}

/* ---- 카드 확대 편집 모달 (텍스트/이미지/배경/색상 + 중앙 스냅 드래그) ---- */
function renderCardEditorModal(){
  const p = state.cardPipeline;
  const cn = p.cardNews;
  const ed = state.cardEditor;
  if(!cn || !ed) return "";
  const idx = ed.slideIdx;
  const slide = cn.slides[idx];
  if(!slide) return "";
  ensureSlideLayers(slide, idx, cn.slides.length);
  const brand = state.brandSettings || {};
  const W = 340, H = 425; // 216:270 과 동일한 4:5 비율의 확대 버전
  const selectedLayerId = ed.selectedLayer || null;

  const layerRows = (slide.layers||[]).map(layer=>{
    const isSelected = layer.id === selectedLayerId;
    const rowBorder = isSelected ? "border:1px solid var(--amber);" : "border:1px solid var(--line);";
    if(layer.type === "image"){
      const isPlaceholder = !layer.src;
      const isNewStyle = layer.wFrac != null && layer.hFrac != null;
      const imgLabel = isPlaceholder ? "🖼️ 이미지 자리 (비어있음)" : (layer.isChart ? "📊 차트/그래프" : "🖼️ 이미지");
      const bgr = ed.bgRemoval;
      const isCutoutBusy = bgr && bgr.layerId === layer.id;
      return `
        <div style="${rowBorder}border-radius:8px;padding:8px;margin-bottom:8px;">
          <div style="display:flex;align-items:center;gap:8px;">
            ${isPlaceholder
              ? `<div style="width:36px;height:36px;border-radius:4px;flex-shrink:0;border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;opacity:0.5;">🖼️</div>`
              : `<img src="${layer.src}" style="width:36px;height:36px;object-fit:cover;border-radius:4px;flex-shrink:0;" />`}
            <div style="flex:1;font-size:11px;font-weight:600;">${imgLabel}${isSelected?' · 선택됨':''}</div>
            <button class="btn outline" data-select-layer="${idx}:${layer.id}" style="font-size:10px;padding:2px 6px;">선택</button>
            <button class="btn outline" data-delete-layer="${idx}:${layer.id}" style="font-size:10px;padding:2px 6px;border-color:var(--seal);color:var(--seal);">삭제</button>
          </div>
          ${isPlaceholder
            ? `<div style="font-size:10px;opacity:0.6;margin-top:6px;">아래 "+ 이미지 추가"나 "이미지 검색해서 넣기"로 실제 이미지를 넣은 다음, 이 자리는 삭제하면 돼요.</div>`
            : (isNewStyle
              ? `<div style="font-size:10px;opacity:0.6;margin-top:6px;">카드 미리보기에서 이 이미지를 누르면 모서리에 크기 조절 손잡이가 나타나요. 손잡이를 끌어서 크기를 바꿔보세요.</div>`
              : `<div style="display:flex;align-items:center;gap:6px;font-size:11px;margin-top:6px;">
                  <span>크기</span>
                  <button class="btn outline" data-layer-font-adjust="${idx}:${layer.id}:-1" style="padding:2px 8px;font-size:12px;">−</button>
                  <input type="number" class="field" data-layer-scale-input="${idx}:${layer.id}" value="${Math.round((layer.scale||1)*100)}" min="30" max="600" step="1" style="width:52px;text-align:center;font-size:11px;padding:2px 4px;" />%
                  <button class="btn outline" data-layer-font-adjust="${idx}:${layer.id}:1" style="padding:2px 8px;font-size:12px;">+</button>
                </div>`)
          }
          ${(!isPlaceholder && !layer.isChart) ? `
            <div style="display:flex;align-items:center;gap:6px;font-size:11px;margin-top:6px;flex-wrap:wrap;">
              <button class="btn outline" data-remove-bg-cutout="${idx}:${layer.id}" ${isCutoutBusy?"disabled":""} style="font-size:10px;padding:3px 8px;">🪄 배경 제거(누끼)</button>
              ${layer.srcBeforeCutout ? `<button class="btn outline" data-revert-bg-cutout="${idx}:${layer.id}" style="font-size:10px;padding:3px 8px;">↩️ 원본으로 되돌리기</button>` : ""}

            </div>
            ${isCutoutBusy ? `<div style="font-size:10px;opacity:0.5;margin-top:4px;">처음 한 번은 인식 모델을 내려받느라 시간이 좀 걸려요(수십 초~1분). 이후엔 브라우저에 저장돼서 훨씬 빨라져요.</div>` : ""}

    if(layer.type === "table"){
      const rows = layer.rows || [];
      const rowsHTML = rows.map((r, ri) => `
        <div style="display:flex;gap:6px;margin-bottom:6px;align-items:center;">

      `).join("");
      return `
        <div style="${rowBorder}border-radius:8px;padding:8px;margin-bottom:8px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
            <span style="font-size:11px;font-weight:700;opacity:0.7;">📊 표${isSelected?' · 선택됨':''}</span>
            <div style="display:flex;gap:6px;">

          </div>

    const fontOptionsHTML = FONT_OPTIONS.map(f=>`<option value="${f.value}" ${((layer.fontFamily||"")===f.value)?"selected":""}>${f.label}</option>`).join("");
    const colorValue = layer.color || textColorForLayerDefault(idx, cn.slides.length, slide);
    return `
      <div style="${rowBorder}border-radius:8px;padding:8px;margin-bottom:8px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
          <span style="font-size:11px;font-weight:700;opacity:0.7;">${layerTypeLabel(layer.type)}${isSelected?' · 선택됨':''}</span>

        </div>
        <div style="display:flex;align-items:center;gap:6px;font-size:11px;flex-wrap:wrap;">
          <select class="field" data-layer-font="${idx}:${layer.id}" style="font-size:11px;padding:4px 6px;">${fontOptionsHTML}</select>

      ` : `
        <div style="margin-bottom:8px;">
          <label class="btn outline" style="font-size:11px;padding:5px 10px;cursor:pointer;">
            + 내 이미지 업로드해서 보관함에 추가
            <input type="file" accept="image/*" id="image-library-upload-input" style="display:none;" />
          </label>
        </div>
        ${state.imageLibrary.length ? `
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-height:220px;overflow:auto;">
            ${state.imageLibrary.map(item=>`
              <div data-image-library-pick="${item.id}" style="cursor:pointer;border-radius:6px;overflow:hidden;border:1px solid var(--line);aspect-ratio:1;background:#f2f1ec;position:relative;">
                <img src="${item.dataUrl}" style="width:100%;height:100%;object-fit:cover;display:block;" />
                <button data-image-library-remove="${item.id}" title="보관함에서 삭제" style="position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:5px;border:none;background:rgba(0,0,0,0.55);color:#fff;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;">✕</button>

            `).join("")}
          </div>
          <div style="font-size:10px;opacity:0.45;margin-top:6px;">이미지를 누르면 바로 삽입돼요. 검색 결과에서 💾로 저장했거나, 직접 업로드한 이미지가 여기 모여요.</div>
        ` : `<div style="font-size:11px;opacity:0.5;">아직 보관함이 비어있어요. 검색 결과에서 💾를 누르거나, 위에서 이미지를 업로드해보세요.</div>`}
      `}
    </div>
  ` : "";

  const cb = ed.chartBuilder;
  const chartBuilderPanel = (cb && cb.open) ? renderChartBuilderPanel(cb) : "";

  return `
    <div class="modal-backdrop" id="card-editor-backdrop">
      <div class="modal-box" style="width:840px;max-width:95vw;display:flex;gap:22px;flex-wrap:wrap;">
        <div style="flex-shrink:0;">
          <div style="font-size:11px;opacity:0.6;margin-bottom:8px;max-width:${W}px;">${idx+1}번 슬라이드 · 텍스트/이미지를 마우스로 끌어 옮기고, 모서리 손잡이로 크기를 자유롭게 바꿔보세요. 텍스트는 더블클릭하면 그 자리에서 바로 쓰거나 지울 수 있어요.</div>
          <div style="font-size:10px;opacity:0.5;margin-bottom:8px;max-width:${W}px;">💡 더블클릭으로 편집 → 다 쓰면 바깥을 눌러 완료 → 다시 한 번 클릭하면 폰트·색·정렬·크기 툴바가 떠요.</div>
          <div style="width:${W}px;height:${H}px;border-radius:12px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,0.2);">
            ${buildCardMarkup(slide, idx, cn.slides.length, brand, W, H, {interactive:true, selectedLayerId, editingLayerId: ed.editingLayer||null})}
          </div>
        </div>
        <div id="card-editor-panel" style="flex:1;min-width:260px;max-height:${H+40}px;overflow:auto;padding-right:4px;">
          <div style="font-weight:700;font-size:13px;margin-bottom:8px;">레이어</div>
          ${layerRows || `<div style="font-size:12px;opacity:0.5;margin-bottom:8px;">레이어가 없어요.</div>`}
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;">
            <button class="btn outline" data-add-layer="${idx}" style="font-size:11px;padding:5px 10px;">+ 텍스트 추가</button>
            <label class="btn outline" style="font-size:11px;padding:5px 10px;cursor:pointer;">
              + 이미지 추가
              <input type="file" accept="image/*" data-add-image-layer="${idx}" style="display:none;" />
            </label>
            <button class="btn outline" data-open-image-search="layer" style="font-size:11px;padding:5px 10px;">🔎 이미지 검색해서 넣기</button>
            <button class="btn outline" data-open-chart-builder="1" style="font-size:11px;padding:5px 10px;">📊 차트/그래프 추가</button>
          </div>

          ${(is && is.purpose==='layer') ? imageSearchPanel : ""}
          ${chartBuilderPanel}

          <div style="font-weight:700;font-size:13px;margin-bottom:6px;">강조 문구 (선택)</div>
          <div class="section-note" style="margin-top:0;">숫자·핵심 한 줄처럼 튀게 보여주고 싶은 문구가 있으면 적어보세요. 본문 슬라이드는 포인트색 강조 바로, 마지막 CTA 슬라이드는 큰 강조 박스로 보여요.</div>
          <input class="field" data-slide-highlight="${idx}" value="${escapeHtml(slide.highlight||"")}" placeholder="예: 6월 모평 졸업생 접수자 약 9만 6천 명 (역대 최고)" style="width:100%;margin-bottom:16px;" />

          <div style="font-weight:700;font-size:13px;margin-bottom:8px;">배경</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px;">
            <label class="btn outline" style="font-size:11px;padding:5px 10px;cursor:pointer;">
              배경 이미지 넣기
              <input type="file" accept="image/*" data-set-bg-image="${idx}" style="display:none;" />
            </label>
            <button class="btn outline" data-open-image-search="bg" style="font-size:11px;padding:5px 10px;">🔎 이미지 검색해서 배경으로</button>
            ${slide.bgImage ? `<button class="btn outline" data-remove-bg-image="${idx}" style="font-size:11px;padding:5px 10px;border-color:var(--seal);color:var(--seal);">배경 이미지 제거</button>` : ""}
          </div>

          ${(is && is.purpose==='bg') ? imageSearchPanel : ""}

          ${slide.bgImage ? `
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:11px;">
              <span style="white-space:nowrap;">배경 투명도</span>
              <input type="range" min="20" max="100" value="${slide.bgImageOpacity!=null?slide.bgImageOpacity:100}" data-set-bg-opacity="${idx}" style="flex:1;" />
              <span style="min-width:34px;text-align:right;">${slide.bgImageOpacity!=null?slide.bgImageOpacity:100}%</span>
            </div>
          ` : ""}

          <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px;font-size:11px;">
            <label style="display:flex;align-items:center;gap:6px;">배경색
              <input type="color" data-set-bg-color="${idx}" value="${bgColorValue}" style="width:32px;height:26px;border:none;padding:0;background:none;cursor:pointer;" />
            </label>
            <label style="display:flex;align-items:center;gap:6px;">글자색(전체)
              <input type="color" data-set-text-color="${idx}" value="${textColorValue}" style="width:32px;height:26px;border:none;padding:0;background:none;cursor:pointer;" />
            </label>
            ${(co.bg||co.text) ? `<button class="btn outline" data-reset-color="${idx}" style="font-size:11px;padding:4px 8px;">색상 초기화</button>` : ""}
          </div>

          <button class="btn" id="close-card-editor-btn" style="width:100%;">편집 완료 · 닫기</button>
        </div>
      </div>
    </div>
  `;
}

/* ---- 카드 안에 직접 넣는 차트/그래프 (Chart.js로 실제로 그려서 이미지 레이어로 삽입) ---- */
const CHART_TYPE_OPTIONS = [
  { v:"bar", l:"막대그래프" },
  { v:"line", l:"꺾은선그래프" },
  { v:"pie", l:"원그래프" },
  { v:"doughnut", l:"도넛차트" },
];

function renderChartBuilderPanel(cb){
  const rows = (cb.rows||[]).map((r, ri)=>`
    <div style="display:flex;gap:6px;margin-bottom:6px;align-items:center;">
      <input class="field" data-chart-row-label="${ri}" style="flex:1;font-size:12px;" placeholder="항목 (예: 1월)" value="${escapeHtml(r.label||"")}" />
      <input class="field" data-chart-row-value="${ri}" type="number" style="width:90px;font-size:12px;" placeholder="값" value="${(r.value!=null && r.value!=="") ? r.value : ""}" />
      <button class="btn outline" data-chart-row-remove="${ri}" style="font-size:11px;padding:4px 8px;border-color:var(--seal);color:var(--seal);" ${(cb.rows.length<=1)?"disabled":""}>✕</button>
    </div>
  `).join("");
  return `
    <div style="border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:14px;">
      <div style="font-size:11px;font-weight:700;margin-bottom:8px;">📊 차트/그래프 만들기 — 항목과 값을 입력하면 실제 차트로 그려서 카드에 넣어요</div>
      <div class="form-grid" style="margin-bottom:8px;">
        <label>차트 종류
          <select class="field" id="chart-builder-type">
            ${CHART_TYPE_OPTIONS.map(o=>`<option value="${o.v}" ${cb.chartType===o.v?"selected":""}>${o.l}</option>`).join("")}
          </select>
        </label>
        <label>제목 (선택)
          <input class="field" id="chart-builder-title" value="${escapeHtml(cb.title||"")}" placeholder="예: 월별 상담 건수" />
        </label>
      </div>
      <div style="font-size:11px;opacity:0.6;margin-bottom:6px;">항목 · 값</div>
      ${rows}
      <button class="btn outline" id="chart-builder-add-row-btn" style="font-size:11px;padding:5px 10px;margin-bottom:10px;">+ 항목 추가</button>
      ${cb.error ? `<div style="font-size:11px;color:var(--seal);margin-bottom:8px;">${escapeHtml(cb.error)}</div>` : ""}
      <div style="display:flex;gap:8px;">
        <button class="btn amber" id="chart-builder-add-btn">차트 추가</button>
        <button class="btn outline" id="chart-builder-close-btn">닫기</button>
      </div>
    </div>
  `;
}

/* 화면 밖(오프스크린) DOM에 실제로 캔버스를 붙여서 Chart.js로 그린 다음 PNG data URL로 캡처한다.
   (카드 캡처에 쓰는 createOffscreenCardNode와 동일한 방식 — 붙어있지 않은 캔버스는 Chart.js가 크기를 제대로 잡지 못함) */
function renderChartToDataURL(builder){
  return new Promise((resolve, reject)=>{
    try{
      const validRows = (builder.rows||[])
        .map(r=>({ label: String(r.label||"").trim(), value: Number(r.value) }))
        .filter(r=>r.label && r.value !== "" && !Number.isNaN(r.value));
      if(!validRows.length){ reject(new Error("항목 이름과 숫자 값을 하나 이상 입력해주세요.")); return; }

      const labels = validRows.map(r=>r.label);
      const values = validRows.map(r=>r.value);
      const isCircular = builder.chartType === "pie" || builder.chartType === "doughnut";
      const palette = ["#06C8E3","#b5342a","#8a5a2b","#2f6f5e","#1c2b45","#c98a3e","#5b7fb5","#9a6fb0"];
      const accent = builder.color || "#06C8E3";

      const W = 720, H = isCircular ? 620 : 520;
      const holder = document.createElement("div");
      holder.style.position = "fixed"; holder.style.left = "-99999px"; holder.style.top = "0"; holder.style.zIndex = "-1";
      holder.style.width = W+"px"; holder.style.height = H+"px"; holder.style.background = "#ffffff"; holder.style.borderRadius = "20px";
      const canvas = document.createElement("canvas");
      holder.appendChild(canvas);
      document.body.appendChild(holder);

      const chart = new Chart(canvas, {
        type: builder.chartType,
        data: {
          labels,
          datasets: [{
            label: builder.title || "",
            data: values,
            backgroundColor: isCircular ? labels.map((_,i)=>palette[i%palette.length]) : accent,
            borderColor: isCircular ? "#ffffff" : accent,
            borderWidth: isCircular ? 2 : 0,
            borderRadius: isCircular ? 0 : 8,
            maxBarThickness: 64,
            tension: builder.chartType==="line" ? 0.35 : 0,
            fill: false,
            pointRadius: builder.chartType==="line" ? 4 : 0,
            pointBackgroundColor: accent,
          }],
        },
        options: {
          responsive:false, animation:false, devicePixelRatio:2,
          layout:{ padding:28 },
          plugins:{
            legend:{ display:isCircular, position:"bottom", labels:{ color:"#1c2b45", font:{ size:16, family:"'Pretendard','Noto Sans KR',sans-serif" }, padding:14 } },
            title:{ display: !!builder.title, text: builder.title||"", color:"#1c2b45", font:{ size:22, weight:"700", family:"'Noto Serif KR',serif" }, padding:{bottom:16} },
            tooltip:{ enabled:false },
          },
          scales: isCircular ? {} : {
            x:{ ticks:{ color:"#1c2b45", font:{ size:14, family:"'Pretendard','Noto Sans KR',sans-serif" } }, grid:{ display:false } },
            y:{ beginAtZero:true, ticks:{ color:"#6b7280", font:{ size:13 } }, grid:{ color:"#eceae2" } },
          },
        },
      });

      // animation:false면 Chart.js가 생성자 안에서 즉시(동기적으로) 그려주므로 requestAnimationFrame을 기다릴 필요가 없다.
      // (백그라운드 탭에서는 rAF가 아예 실행되지 않아 무한 대기할 수 있어서 일부러 쓰지 않는다)
      try{
        const dataUrl = canvas.toDataURL("image/png");
        const naturalWidth = canvas.width, naturalHeight = canvas.height;
        chart.destroy();
        document.body.removeChild(holder);
        resolve({ dataUrl, naturalWidth, naturalHeight });
      }catch(e){
        chart.destroy();
        document.body.removeChild(holder);
        reject(e);
      }
    }catch(e){ reject(e); }
  });
}

/* ---- 카드뉴스 실제 디자인 렌더링 (미리보기 & PNG 캡처 공용) ---- */
function isDarkColor(hex){
  const h = String(hex||"").replace('#','');
  if(h.length < 6) return false;
  const r = parseInt(h.substr(0,2),16), g = parseInt(h.substr(2,2),16), b = parseInt(h.substr(4,2),16);
  if(Number.isNaN(r) || Number.isNaN(g) || Number.isNaN(b)) return false;
  const luminance = (0.299*r + 0.587*g + 0.114*b) / 255;
  return luminance < 0.5;
}

function escapeHtml(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

/* 클립보드 복사: 버튼 요소를 넘기면 잠깐 "복사됨"으로 바뀌었다가 원래 라벨로 돌아온다 (전체 렌더 없이 처리) */
async function copyTextToClipboard(text, btnEl){
  try{
    await navigator.clipboard.writeText(text);
    if(btnEl){
      const original = btnEl.textContent;
      btnEl.textContent = "✅ 복사됨";
      setTimeout(()=>{ btnEl.textContent = original; }, 1500);
    }
  }catch(e){
    alert("클립보드 복사에 실패했어요. 직접 드래그해서 복사해주세요.");
  }
}

/* 텍스트 레이어 종류별 "기준" 글자 크기(px, scale=1 기준). buildCardMarkup과 리사이즈 핸들 드래그 로직이 함께 사용 */
/* 카드 캔버스 하나를 받아서, 실제로 렌더링된 헤드라인/보조설명 높이를 측정해
   보조설명과 강조박스를 서로 겹치지 않고 딱 붙게 재배치한다.
   (글자수 추정이 아니라 브라우저가 계산한 실제 레이아웃을 쓰기 때문에 정확하다)
   slide.autoFlowSubtext가 false면(사용자가 보조설명을 직접 드래그해서 옮긴 경우) 보조설명 위치는 건드리지 않는다. */
function applyDynamicFlow(canvasEl, slide){
  if(!canvasEl || !slide) return;
  const canvasRect = canvasEl.getBoundingClientRect();
  if(!canvasRect.height) return;
  const headlineEl = canvasEl.querySelector('[data-role="headline"]');
  const subtextEl = canvasEl.querySelector('[data-role="subtext"]');
  const highlightEl = canvasEl.querySelector('[data-role="highlight"]');
  const ctaBoxEl = canvasEl.querySelector('[data-role="cta-box"]');
  const footerEl = canvasEl.querySelector('[data-role="footer"]');

  if(slide.autoFlowSubtext !== false && headlineEl && subtextEl){
    const hRect = headlineEl.getBoundingClientRect();
    const sRect = subtextEl.getBoundingClientRect(); // 위치는 아직 예전 값이어도 높이는 정확함
    const gapPx = canvasRect.height * 0.035;
    const desiredTopPx = (hRect.bottom - canvasRect.top) + gapPx;
    const desiredCenterPx = desiredTopPx + sRect.height/2;
    const newTopPercent = Math.max(5, Math.min(92, (desiredCenterPx / canvasRect.height) * 100));
    subtextEl.style.top = newTopPercent + "%";
    const subtextLayer = (slide.layers||[]).find(l=>l.type==="subtext");
    if(subtextLayer) subtextLayer.y = Math.round(newTopPercent);
  }

  const footerTopLimit = footerEl
    ? (footerEl.getBoundingClientRect().top - canvasRect.top) - canvasRect.height*0.02
    : canvasRect.height*0.86;

  if(highlightEl && subtextEl){
    const sRect2 = subtextEl.getBoundingClientRect();
    const gapPx2 = canvasRect.height * 0.032;
    const topPx = Math.min((sRect2.bottom - canvasRect.top) + gapPx2, Math.min(canvasRect.height*0.8, footerTopLimit - highlightEl.getBoundingClientRect().height));
    highlightEl.style.top = Math.round(topPx) + "px";
  }

  if(ctaBoxEl && subtextEl){
    const sRect3 = subtextEl.getBoundingClientRect();
    const boxH = ctaBoxEl.getBoundingClientRect().height;
    const gapPx3 = canvasRect.height * 0.05;
    const desired = (sRect3.bottom - canvasRect.top) + gapPx3;
    const finalTop = Math.min(desired, footerTopLimit - boxH);
    ctaBoxEl.style.top = Math.round(finalTop) + "px";
  }
}

/* 화면에 지금 보이는 모든 카드 캔버스(썸네일 목록 + 확대 편집 모달)에 동적 레이아웃 보정을 적용 */
function applyDynamicFlowToVisibleCards(){
  const cn = state.cardPipeline.cardNews;
  if(!cn) return;
  document.querySelectorAll("[data-card-canvas]").forEach(canvasEl=>{
    const idx = Number(canvasEl.dataset.cardCanvas);
    const slide = cn.slides[idx];
    if(slide) applyDynamicFlow(canvasEl, slide);
  });
}

function baseFontSizeForType(type, w, isCover, isCta){
  if(type === "headline") return w * (isCover ? 0.075 : (isCta ? 0.062 : 0.058));
  if(type === "subtext") return w * 0.032;
  return w * 0.036; // custom
}

/* 대략적인 텍스트 렌더 높이 추정 (한글 위주 텍스트 기준 근사치, DOM 없이 계산) */
function estimateTextHeightPx(text, fontSizePx, lineHeight, boxWidthPx){
  if(!text) return 0;
  const charWidth = fontSizePx * 0.98;
  const charsPerLine = Math.max(1, Math.floor(boxWidthPx / charWidth));
  const logicalLines = String(text).split("\n");
  let totalLines = 0;
  logicalLines.forEach(line=>{
    const len = line.trim().length || 1;
    totalLines += Math.max(1, Math.ceil(len / charsPerLine));
  });
  return totalLines * fontSizePx * lineHeight;
}

/* 카드뉴스를 새로 생성할 때, 헤드라인/보조설명 글자 수를 감안해서 서로 겹치지 않는 초기 y(%) 위치를 계산한다.
   1080x1350 기준 캔버스로 계산 (buildCardMarkup과 동일한 폰트 크기 공식을 사용) */
function computeInitialSlideLayout(headline, subtext, isCover, isCta, hasVisual){
  const W = 1080, H = 1350;
  const boxWidth = W * 0.84;
  // 콘텐츠가 들어갈 수 있는 영역(밴드)의 위/아래 경계. 예전엔 항상 bandTop에서 시작해서
  // 텍스트가 적으면 카드 하단이 통째로 비어보였음 — 이제는 이 밴드 안에서 세로로 중앙 정렬한다.
  const bandTop = isCta ? H*0.30 : (isCover ? H*0.19 : H*0.185);
  let bandBottom = isCta ? H*0.57 : (isCover ? H*0.78 : H*0.75);
  // 이미지·차트·표가 들어갈 슬라이드는 텍스트 밴드를 위로 줄여서 그 아래에 실제 공간을 남겨둔다.
  // (줄이지 않으면 텍스트가 카드 하단까지 차지해버려서 이미지/표를 놓을 자리가 없어진다)
  const visualZoneBottom = isCta ? H*0.60 : H*0.88; // 이 아래는 CTA 박스/푸터라 침범하면 안 됨
  if(hasVisual) bandBottom = Math.max(bandTop + H*0.12, bandBottom - H*0.15);

  const headlineFontSize = baseFontSizeForType("headline", W, isCover, isCta);
  const headlineLineHeight = 1.18;
  const headlineH = Math.max(headlineFontSize*headlineLineHeight, estimateTextHeightPx(headline, headlineFontSize, headlineLineHeight, boxWidth));

  const subtextFontSize = baseFontSizeForType("subtext", W, isCover, isCta);
  const subtextLines = String(subtext||"").split("\n").map(l=>l.trim()).filter(Boolean);
  const isMultiLine = subtextLines.length >= 2;
  const subtextLineHeight = 1.5;
  // 항목이 여러 줄이면 줄마다 구분선용 여백(padding)이 살짝 붙으므로 그만큼만 여유를 더 준다 (예전엔 색 박스 전체 패딩이라 더 컸음)
  const subtextPadding = isMultiLine ? H*0.012*subtextLines.length : 0;
  const subtextH = Math.max(subtextFontSize*subtextLineHeight, estimateTextHeightPx(subtext, subtextFontSize, subtextLineHeight, boxWidth) + subtextPadding);

  const gap = H * 0.035;
  const blockH = headlineH + gap + subtextH;
  // 블록이 밴드보다 짧으면 아래로 내려서 밴드 중앙에 오게 하고, 블록이 밴드보다 길면(텍스트가 많으면) bandTop에서 그냥 시작한다.
  const contentTop = bandTop + Math.max(0, ((bandBottom - bandTop) - blockH) / 2);
  const headlineCenterY = contentTop + headlineH/2;
  const subtextCenterY = contentTop + headlineH + gap + subtextH/2;

  const clamp = (v) => Math.max(10, Math.min(90, v));
  const result = {
    headlineY: clamp(Math.round((headlineCenterY / H) * 100)),
    subtextY: clamp(Math.round((subtextCenterY / H) * 100)),
  };
  if(hasVisual){
    // 텍스트 밴드 아래부터 CTA박스/푸터 앞까지 남은 공간의 중앙에 이미지·표 자리를 배치한다.
    const visualTop = Math.max(bandBottom, subtextCenterY + subtextH/2 + H*0.02);
    const visualSpace = Math.max(H*0.1, visualZoneBottom - visualTop);
    result.visualY = clamp(Math.round(((visualTop + visualTop + visualSpace) / 2 / H) * 100));
    result.visualHFrac = Math.max(0.12, Math.min(0.32, (visualSpace * 0.85) / H));
  }
  return result;
}
