/* 슬라이드 위치(표지/본문/CTA)에 따른 기본 배경·글자·강조색 (colorOverride 적용 전 값) */
function resolveSlideTheme(idx, total){
  const t = cardTheme();
  const isCover = idx === 0;
  const isCta = idx === total - 1;
  if(isCover) return { bg:t.coverBg, text:t.coverText, accent:t.accent };
  if(isCta) return { bg:t.ctaBg, text:t.ctaText, accent:t.accent };
  return { bg:t.contentBg, text:t.contentText, accent:t.accent };
}

/* 예전 저장된 프로젝트(레이어 없이 headline/subtext만 있던 형식)를 레이어 구조로 이관 */
/* 상단 킥커 라벨·슬라이드 번호·하단 사무소명/연락처를 "레이어"로 만든다. 예전엔 이 넷이 브랜드 설정에서만
   고정으로 그려지는 고정 요소라 슬라이드별로 따로 편집할 수 없었음 — 이제는 다른 레이어처럼 드래그·수정·삭제가
   되면서, 동시에 "🎨 카드뉴스 설정 → 킥커·발행주체 일괄 수정"으로 전체 슬라이드에 한 번에 통일도 가능하다. */
function makeChromeLayers(idx, total, brand){
  const isCover = idx === 0;
  const isCta = (idx != null && total != null) ? idx === total - 1 : false;
  const kickerText = (brand && brand.kicker) ? brand.kicker : "가이드";
  const org = (brand && brand.orgName) ? brand.orgName : "법률사무소 OOO";
  const phone = (brand && brand.phone) ? brand.phone : "02-0000-0000";
  const layers = [
    { id:"kicker", type:"kicker", text: kickerText, x:50, y:7, scale:1, align:"left" },
  ];
  if(!isCover && !isCta){
    layers.push({ id:"pagenum", type:"pagenum", text: String(idx).padStart(2,"0"), x:50, y:10, scale:1, align:"left" });
  }
  layers.push({ id:"footer-org", type:"footer-org", text: org.toUpperCase(), x:50, y:93, scale:1, align:"left" });
  if(isCta){
    layers.push({ id:"footer-phone", type:"footer-phone", text: phone, x:50, y:93, scale:1, align:"right" });
  }
  return layers;
}

function ensureSlideLayers(slide, idx, total){
  if(!slide.layers){
    const isCta = (idx!=null && total!=null) ? idx === total-1 : false;
    const align = isCta ? "center" : "left";
    slide.layers = [
      { id:"headline", type:"headline", text: slide.headline||"", x:50, y:30, scale: slide.headlineScale||1, align },
      { id:"subtext", type:"subtext", text: slide.subtext||"", x:50, y:58, scale: slide.subtextScale||1, align },
    ];
  }
  // 예전에 만들어진 슬라이드(킥커·페이지번호·푸터가 레이어가 아니라 고정 그림이던 시절)를 위한 이관:
  // 없는 것만 채워 넣는다 — 이미 있으면(사용자가 지우기로 선택했을 수도 있음) 건드리지 않는다.
  const hasAnyChrome = (slide.layers||[]).some(l=>l.id==="kicker"||l.id==="pagenum"||l.id==="footer-org"||l.id==="footer-phone");
  if(!hasAnyChrome){
    slide.layers.push(...makeChromeLayers(idx, total, state.brandSettings));
  }
  if(slide.highlight == null) slide.highlight = "";
  if(slide.autoFlowSubtext == null) slide.autoFlowSubtext = true;
  return slide;
}
function normalizeCardNews(cardNews){
  if(!cardNews) return cardNews;
  const total = (cardNews.slides||[]).length;
  (cardNews.slides||[]).forEach((s,i)=>ensureSlideLayers(s, i, total));
  return cardNews;
}

function buildCardMarkup(slide, idx, total, brand, w, h, opts){
  opts = opts || {};
  const interactive = !!opts.interactive;
  ensureSlideLayers(slide, idx, total);
  const isCover = idx === 0;
  const isCta = idx === total - 1;
  const pad = Math.round(w*(80/1080)); // Safe Margin 80px 기준 그리드
  const baseHeadlineSize = w * (isCover ? 0.075 : (isCta ? 0.062 : 0.058));
  const baseSubtextSize = w * 0.032;
  const baseCustomSize = w * 0.036;
  const baseImageSize = w * 0.55;
  const footerSize = Math.round(w * 0.026);
  // 킥커·사무소명은 이제 각각 kicker/footer-org 레이어가 그리므로 여기선 안 씀. phone·tagline은
  // CTA 박스(highlightHTML)에서 여전히 필요해서 남겨둠.
  const phone = brand && brand.phone ? brand.phone : "02-0000-0000";
  const tagline = brand && brand.tagline ? brand.tagline : "지금 상담 신청하세요";

  const theme = resolveSlideTheme(idx, total);
  let bg = theme.bg, textColor = theme.text, accentColor = theme.accent;
  const co = slide.colorOverride;
  if(co){
    if(co.bg) bg = co.bg;
    if(co.text) textColor = co.text;
  }
  // 제목(진한 색)과 본문(보조색)의 위계를 분명히 하기 위한 보조(Secondary) 텍스트색
  const secondaryTextColor = isDarkColor(bg) ? "rgba(255,255,255,0.68)" : "#515E73";

  const bgOpacity = (slide.bgImageOpacity != null ? slide.bgImageOpacity : 100) / 100;
  const bgImageHTML = slide.bgImage ? `
    <img src="${slide.bgImage}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:${bgOpacity};" />
    <div style="position:absolute;inset:0;background:rgba(18,28,40,0.4);"></div>
  ` : "";

  // 상단 가로선 (Header) — 킥커 텍스트 자체는 이제 "kicker" 레이어라서 여기선 장식용 선만 고정으로 그린다.
  // (킥커 레이어가 자유롭게 움직일 수 있게 되면서, 선을 킥커 텍스트 너비에 맞춰 따라가게 하진 않기로 함)
  const topRow = `
    <div style="position:absolute;left:${Math.round(w*0.4)}px;right:${pad}px;top:${Math.round(pad + footerSize*0.6)}px;height:1px;background:${textColor};opacity:0.2;"></div>
  `;

  // 강조 요소: 본문 슬라이드는 포인트색 좌측 바(Template B), 마지막 CTA 슬라이드는 흰색 박스 안에 다크 텍스트(Template K)
  let highlightHTML = "";
  if(isCta){
    // 박스 안 문구(강조 HIGHLIGHT 또는 태그라인)만 행동 유도 역할을 하고, 아래 보조 줄은 항상 연락처로 고정한다.
    // (예전엔 HIGHLIGHT가 있을 때 태그라인이 보조 줄로 내려와 같은 의미의 CTA 두 개가 겹쳐 보였음)
    const boxMainText = slide.highlight || tagline;
    const descText = phone;
    highlightHTML = `
      <div data-role="cta-box" style="position:absolute;left:${pad}px;right:${pad}px;top:${Math.round(h*0.62)}px;">
        <div style="background:#ffffff;border-radius:${Math.round(w*0.03)}px;padding:${Math.round(h*0.034)}px ${Math.round(w*0.06)}px;text-align:center;">
          <div style="font-family:'Pretendard','Noto Sans KR',sans-serif;font-weight:800;font-size:${Math.round(w*0.042)}px;line-height:1.35;color:#121B27;word-break:keep-all;">${escapeHtml(boxMainText)}</div>
        </div>
        <div style="text-align:center;font-family:'Pretendard','IBM Plex Mono',monospace;font-weight:600;font-size:${Math.round(w*0.028)}px;color:${accentColor};margin-top:${Math.round(h*0.02)}px;">${escapeHtml(descText)}</div>
      </div>
    `;
  } else if(slide.highlight){
    // 보조설명 레이어의 실제 위치·길이를 보고 그 바로 아래에 오도록 동적으로 계산 (텍스트가 길어져도 겹치지 않게)
    const subtextLayer = (slide.layers||[]).find(l=>l.type==="subtext");
    let anchorFrac = 0.72;
    if(subtextLayer){
      const subtextFontSize = baseFontSizeForType("subtext", w, isCover, isCta) * (subtextLayer.scale||1);
      const subtextLines = String(subtextLayer.text||"").split("\n").map(l=>l.trim()).filter(Boolean);
      const isMultiLine = subtextLines.length >= 2;
      const subtextPadding = isMultiLine ? h*0.012*subtextLines.length : 0;
      const subtextHpx = Math.max(subtextFontSize*1.5, estimateTextHeightPx(subtextLayer.text, subtextFontSize, 1.5, w*0.84) + subtextPadding);
      anchorFrac = ((subtextLayer.y/100)*h + subtextHpx/2) / h;
    }
    const highlightTopPx = Math.min(Math.round(anchorFrac*h + h*0.03), Math.round(h*0.78));
    highlightHTML = `
      <div data-role="highlight" style="position:absolute;left:${pad}px;right:${pad}px;top:${highlightTopPx}px;border-left:${Math.round(w*0.012)}px solid ${accentColor};padding:${Math.round(h*0.012)}px 0 ${Math.round(h*0.012)}px ${Math.round(w*0.035)}px;">
        <div style="font-family:'Pretendard','Noto Sans KR',sans-serif;font-weight:800;font-size:${Math.round(w*0.038)}px;line-height:1.35;color:${accentColor};word-break:keep-all;">${escapeHtml(slide.highlight)}</div>
      </div>
    `;
  }

  // 슬라이드 번호("01","02"...)는 이제 "pagenum" 레이어가 그린다 — 여기선 아무것도 안 그림.
  const indexNumberHTML = "";

  // 푸터의 사무소명·전화번호 텍스트도 이제 각각 "footer-org"/"footer-phone" 레이어가 그린다.
  // 여기선 CTA 슬라이드의 장식용 구분선만 고정으로 그린다 (그 선 자체는 편집 대상이 아님).
  const footerHTML = isCta ? `
    <div style="position:absolute;left:${pad}px;right:${pad}px;bottom:${Math.round(h*0.075)}px;height:1px;background:${textColor};opacity:0.2;"></div>
  ` : "";

  const dragAttrs = interactive ? "cursor:move;touch-action:none;" : "pointer-events:none;";
  const layerAttr = (i, id) => interactive ? `data-layer="${i}:${id}"` : "";
  const selectedLayerId = interactive ? opts.selectedLayerId : null;
  const editingLayerId = interactive ? opts.editingLayerId : null;

  const layersHTML = (slide.layers||[]).map(layer=>{
    const selected = selectedLayerId === layer.id;
    const selectOutline = selected ? "outline:2px dashed var(--amber);outline-offset:2px;" : "";
    if(layer.type === "image"){
      if(!layer.src){
        // 이미지 자리 표시자 — "이미지·차트 넣을 자리 남기기"를 체크했지만 아직 채워지지 않은 슬라이드에 보인다.
        const pxW = Math.round((layer.wFrac||0.6) * w);
        const pxH = Math.round((layer.hFrac||0.45) * h);
        const placeholderBg = isDarkColor(bg) ? "rgba(255,255,255,0.06)" : "rgba(18,28,40,0.04)";
        return `
          <div ${layerAttr(idx, layer.id)} style="position:absolute;left:${layer.x}%;top:${layer.y}%;transform:translate(-50%,-50%);width:${pxW}px;height:${pxH}px;border-radius:${Math.round(w*0.02)}px;border:2px dashed ${accentColor};background:${placeholderBg};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:${Math.round(h*0.008)}px;box-sizing:border-box;${dragAttrs}user-select:none;${selectOutline}">
            <div style="font-size:${Math.round(w*0.05)}px;opacity:0.5;line-height:1;">🖼️</div>
            <div style="font-family:'Pretendard','Noto Sans KR',sans-serif;font-size:${Math.round(w*0.024)}px;color:${textColor};opacity:0.55;text-align:center;word-break:keep-all;padding:0 ${Math.round(w*0.02)}px;">이미지·차트 자리</div>
          </div>
        `;
      }
      if(layer.wFrac != null && layer.hFrac != null){
        const pxW = Math.round(layer.wFrac * w);
        const pxH = Math.round(layer.hFrac * h);
        return `
          <img ${layerAttr(idx, layer.id)} src="${layer.src}" style="position:absolute;left:${layer.x}%;top:${layer.y}%;transform:translate(-50%,-50%);width:${pxW}px;height:${pxH}px;object-fit:cover;border-radius:${Math.round(w*0.015)}px;border:1px solid rgba(0,0,0,0.06);${dragAttrs}user-select:none;${selectOutline}" />
        `;
      }
      // 예전 버전(scale 기반)으로 저장된 이미지 레이어 호환
      const imgSize = Math.round(baseImageSize * (layer.scale || 1));
      return `
        <img ${layerAttr(idx, layer.id)} src="${layer.src}" style="position:absolute;left:${layer.x}%;top:${layer.y}%;transform:translate(-50%,-50%);width:${imgSize}px;height:auto;border-radius:${Math.round(w*0.015)}px;border:1px solid rgba(0,0,0,0.06);${dragAttrs}user-select:none;${selectOutline}" />
      `;
    }
    if(layer.type === "table"){
      // AI가 원문에서 실제로 뽑아낸 항목·값 쌍을 표처럼 보여준다 (구분선 스타일은 다중 항목 보조설명과 통일).
      if(!layer.rows || !layer.rows.length) return "";
      const dividerColor = isDarkColor(bg) ? "rgba(255,255,255,0.16)" : "rgba(18,28,40,0.12)";
      const tableFontSize = Math.round(baseSubtextSize * (layer.scale || 1));
      const rowsHTML = layer.rows.map((row, ri) => `
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:${Math.round(w*0.025)}px;padding:${Math.round(h*0.014)}px 0;${ri < layer.rows.length-1 ? `border-bottom:1px solid ${dividerColor};` : ""}">
          <div style="font-family:'Pretendard','Noto Sans KR',sans-serif;font-weight:700;color:${textColor};word-break:keep-all;">${escapeHtml(row.label)}</div>
          <div style="font-family:'Pretendard','IBM Plex Mono',monospace;font-weight:700;color:${accentColor};white-space:nowrap;">${escapeHtml(row.value)}</div>
        </div>
      `).join("");
      return `
        <div ${layerAttr(idx, layer.id)} style="position:absolute;left:${layer.x}%;top:${layer.y}%;transform:translate(-50%,-50%);width:${Math.round(w*0.84)}px;font-size:${tableFontSize}px;box-sizing:border-box;user-select:none;${dragAttrs}${selectOutline}">${rowsHTML}</div>
      `;
    }
    let baseSize, fontFamily, fontWeight, opacity, lineHeight, defaultColor;
    if(layer.type === "headline"){ baseSize = baseHeadlineSize; fontFamily = "'Pretendard','Noto Sans KR',sans-serif"; fontWeight = 800; opacity = 1; lineHeight = 1.22; defaultColor = textColor; }
    else if(layer.type === "subtext"){ baseSize = baseSubtextSize; fontFamily = "'Pretendard','Noto Sans KR',sans-serif"; fontWeight = 500; opacity = 1; lineHeight = 1.5; defaultColor = secondaryTextColor; }
    else if(layer.type === "kicker"){ baseSize = footerSize; fontFamily = "'Pretendard','Noto Sans KR',sans-serif"; fontWeight = 700; opacity = 1; lineHeight = 1.2; defaultColor = textColor; }
    else if(layer.type === "pagenum"){ baseSize = w*0.042; fontFamily = "'Pretendard','Noto Sans KR',sans-serif"; fontWeight = 900; opacity = 1; lineHeight = 1; defaultColor = accentColor; }
    else if(layer.type === "footer-org"){ baseSize = footerSize*1.15; fontFamily = "'Pretendard','Noto Sans KR',sans-serif"; fontWeight = 800; opacity = 1; lineHeight = 1.2; defaultColor = textColor; }
    else if(layer.type === "footer-phone"){ baseSize = footerSize; fontFamily = "'Pretendard','IBM Plex Mono',monospace"; fontWeight = 600; opacity = 0.75; lineHeight = 1.2; defaultColor = textColor; }
    else { baseSize = baseCustomSize; fontFamily = "'Pretendard','Noto Sans KR',sans-serif"; fontWeight = 600; opacity = 1; lineHeight = 1.35; defaultColor = textColor; }
    if(layer.fontFamily) fontFamily = layer.fontFamily;
    if(layer.bold != null) fontWeight = layer.bold ? 800 : 400;
    const fontStyle = layer.italic ? "italic" : "normal";
    const textDecoration = layer.underline ? "underline" : "none";
    const textFillColor = layer.color || defaultColor;
    const textAlign = layer.align || "center";
    const fontSize = Math.round(baseSize * (layer.scale || 1));
    const boxWidth = Math.round(w*0.84);
    if(interactive && layer.id === editingLayerId){
      return `
        <textarea data-layer-edit-box="${idx}:${layer.id}" data-role="${layer.type}" style="position:absolute;left:${layer.x}%;top:${layer.y}%;transform:translate(-50%,-50%);width:${boxWidth}px;min-height:${Math.round(fontSize*1.6)}px;text-align:${textAlign};font-family:${fontFamily};font-weight:${fontWeight};font-style:${fontStyle};text-decoration:${textDecoration};font-size:${fontSize}px;line-height:${lineHeight};color:${textFillColor};background:rgba(255,255,255,0.9);border:1.5px dashed var(--amber);border-radius:4px;padding:2px 4px;resize:none;overflow:hidden;outline:none;white-space:pre-wrap;word-break:keep-all;z-index:90;">${escapeHtml(layer.text)}</textarea>
      `;
    }
    if(!layer.text) return "";
    if(layer.type === "subtext"){
      const rawLines = layer.text.split("\n").map(l=>l.trim()).filter(Boolean);
      if(rawLines.length >= 2){
        // 예전엔 색이 채워진 박스로 감쌌는데, 슬라이드마다 똑같이 박스 처리되니 단조로워 보였다.
        // 지금은 배경 없이 항목 사이에 얇은 구분선만 넣는 가벼운 스타일로 바꿨다.
        const dividerColor = isDarkColor(bg) ? "rgba(255,255,255,0.14)" : "rgba(18,28,40,0.1)";
        const dotSize = Math.max(5, Math.round(w*0.013));
        const rowsHTML = rawLines.map((line, li) => `
          <div style="display:flex;align-items:flex-start;gap:${Math.round(w*0.02)}px;padding:${Math.round(h*0.012)}px 0;${li < rawLines.length-1 ? `border-bottom:1px solid ${dividerColor};` : ""}">
            <div style="width:${dotSize}px;height:${dotSize}px;min-width:${dotSize}px;border-radius:50%;background:${accentColor};margin-top:${Math.round(fontSize*0.45)}px;"></div>
            <div style="flex:1;word-break:keep-all;">${escapeHtml(line)}</div>
          </div>
        `).join("");
        return `
          <div ${layerAttr(idx, layer.id)} data-role="${layer.type}" style="position:absolute;left:${layer.x}%;top:${layer.y}%;transform:translate(-50%,-50%);width:${boxWidth}px;text-align:${textAlign==='center'?'left':textAlign};font-family:${fontFamily};font-weight:${fontWeight};font-style:${fontStyle};text-decoration:${textDecoration};font-size:${fontSize}px;line-height:${lineHeight};color:${textFillColor};opacity:${opacity};box-sizing:border-box;user-select:none;word-break:keep-all;${dragAttrs}${selectOutline}">${rowsHTML}</div>
        `;
      }
    }
    return `
      <div ${layerAttr(idx, layer.id)} data-role="${layer.type}" style="position:absolute;left:${layer.x}%;top:${layer.y}%;transform:translate(-50%,-50%);width:${boxWidth}px;text-align:${textAlign};font-family:${fontFamily};font-weight:${fontWeight};font-style:${fontStyle};text-decoration:${textDecoration};font-size:${fontSize}px;line-height:${lineHeight};color:${textFillColor};opacity:${opacity};white-space:pre-wrap;word-break:keep-all;user-select:none;${dragAttrs}${selectOutline}">${escapeHtml(layer.text)}</div>
    `;
  }).join("");

  // 선택된 이미지 레이어가 있으면 모서리에 크기 조절 핸들을 그린다
  let resizeHandleHTML = "";
  if(interactive && selectedLayerId){
    const sel = (slide.layers||[]).find(l=>l.id===selectedLayerId && l.type==="image" && l.wFrac!=null && l.hFrac!=null);
    if(sel){
      const pxW = sel.wFrac*w, pxH = sel.hFrac*h;
      const cx = (sel.x/100)*w, cy = (sel.y/100)*h;
      const handleLeft = Math.round(cx + pxW/2), handleTop = Math.round(cy + pxH/2);
      resizeHandleHTML = `<div data-resize-handle="${idx}:${sel.id}" style="position:absolute;left:${handleLeft}px;top:${handleTop}px;transform:translate(-50%,-50%);width:16px;height:16px;background:var(--amber);border:2px solid #fff;border-radius:4px;cursor:nwse-resize;box-shadow:0 1px 4px rgba(0,0,0,0.35);z-index:60;"></div>`;
    }
  }

  // 선택된 텍스트 레이어가 있으면(편집 중이 아닐 때) 모서리에 자유 크기 조절 핸들을 그린다
  let textResizeHandleHTML = "";
  if(interactive && selectedLayerId && selectedLayerId !== editingLayerId){
    const selT = (slide.layers||[]).find(l=>l.id===selectedLayerId && l.type !== "image" && l.type !== "table");
    if(selT){
      const baseSizeT = baseFontSizeForType(selT.type, w, isCover, isCta);
      const fontSizeT = baseSizeT * (selT.scale || 1);
      const boxW = Math.round(w*0.84);
      const boxH = Math.round(fontSizeT * 1.6); // 텍스트 줄 수에 따라 실제 높이는 다를 수 있는 대략치
      const cx = (selT.x/100)*w, cy = (selT.y/100)*h;
      const handleLeft = Math.round(cx + boxW/2), handleTop = Math.round(cy + boxH/2);
      textResizeHandleHTML = `<div data-text-resize-handle="${idx}:${selT.id}" style="position:absolute;left:${handleLeft}px;top:${handleTop}px;transform:translate(-50%,-50%);width:16px;height:16px;background:var(--amber);border:2px solid #fff;border-radius:4px;cursor:nwse-resize;box-shadow:0 1px 4px rgba(0,0,0,0.35);z-index:60;"></div>`;
    }
  }

  // 선택된 텍스트 레이어가 있으면(편집 중이 아닐 때) 그 자리 바로 위에 폰트·색·굵게/기울임/밑줄·정렬·크기 조절 툴바를 띄운다
  let textToolbarHTML = "";
  if(interactive && selectedLayerId && selectedLayerId !== editingLayerId){
    const selText = (slide.layers||[]).find(l=>l.id===selectedLayerId && l.type !== "image" && l.type !== "table");
    if(selText){
      const toolbarFontOptions = FONT_OPTIONS.map(f=>`<option value="${f.value}" ${((selText.fontFamily||"")===f.value)?"selected":""}>${f.label}</option>`).join("");
      const toolbarColor = selText.color || textColor;
      const align = selText.align || "center";
      const alignBtn = (val, label) => `<button data-layer-align="${idx}:${selText.id}:${val}" style="width:22px;height:22px;font-size:11px;border-radius:4px;border:1px solid var(--line);background:${align===val?'var(--amber)':'#fff'};color:${align===val?'#fff':'var(--ink)'};cursor:pointer;">${label}</button>`;
      textToolbarHTML = `
        <div style="position:absolute;left:${selText.x}%;top:${selText.y}%;transform:translate(-50%, calc(-100% - 12px));background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,0.25);padding:5px 6px;display:flex;align-items:center;gap:4px;white-space:nowrap;z-index:80;">
          <select data-layer-font="${idx}:${selText.id}" style="font-size:10px;padding:2px 3px;border:1px solid var(--line);border-radius:4px;max-width:86px;">${toolbarFontOptions}</select>
          <input type="color" data-layer-color="${idx}:${selText.id}" value="${toolbarColor}" style="width:22px;height:22px;border:none;padding:0;background:none;cursor:pointer;" title="글자색" />
          <button data-layer-toggle="${idx}:${selText.id}:bold" style="width:22px;height:22px;font-size:11px;font-weight:700;border-radius:4px;border:1px solid var(--line);background:${selText.bold?'var(--amber)':'#fff'};color:${selText.bold?'#fff':'var(--ink)'};cursor:pointer;">B</button>
          <button data-layer-toggle="${idx}:${selText.id}:italic" style="width:22px;height:22px;font-size:11px;font-style:italic;border-radius:4px;border:1px solid var(--line);background:${selText.italic?'var(--amber)':'#fff'};color:${selText.italic?'#fff':'var(--ink)'};cursor:pointer;">I</button>
          <button data-layer-toggle="${idx}:${selText.id}:underline" style="width:22px;height:22px;font-size:11px;text-decoration:underline;border-radius:4px;border:1px solid var(--line);background:${selText.underline?'var(--amber)':'#fff'};color:${selText.underline?'#fff':'var(--ink)'};cursor:pointer;">U</button>
          <span style="width:1px;height:18px;background:var(--line);margin:0 2px;"></span>
          ${alignBtn("left","⟵")}
          ${alignBtn("center","⟷")}
          ${alignBtn("right","⟶")}
          <span style="width:1px;height:18px;background:var(--line);margin:0 2px;"></span>
          <button data-layer-font-adjust="${idx}:${selText.id}:-1" style="width:20px;height:22px;font-size:12px;border-radius:4px;border:1px solid var(--line);background:#fff;cursor:pointer;">−</button>
          <input type="number" data-layer-scale-input="${idx}:${selText.id}" value="${Math.round((selText.scale||1)*100)}" min="30" max="600" step="1" style="width:38px;height:22px;text-align:center;font-size:10px;border:1px solid var(--line);border-radius:4px;padding:0 2px;" />
          <button data-layer-font-adjust="${idx}:${selText.id}:1" style="width:20px;height:22px;font-size:12px;border-radius:4px;border:1px solid var(--line);background:#fff;cursor:pointer;">+</button>
        </div>
      `;
    }
  }

  return `
    <div data-card-canvas="${idx}" style="width:${w}px;height:${h}px;background:${bg};position:relative;box-sizing:border-box;overflow:hidden;">
      ${bgImageHTML}
      ${topRow}
      ${indexNumberHTML}
      ${layersHTML}
      ${highlightHTML}
      ${resizeHandleHTML}
      ${textResizeHandleHTML}
      ${textToolbarHTML}
      ${footerHTML}
    </div>
  `;
}

function readFileAsDataURL(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result);
    reader.onerror = ()=> reject(reader.error || new Error("파일을 읽지 못했어요."));
    reader.readAsDataURL(file);
  });
}

function loadImageDims(src){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=> resolve({ naturalWidth: img.naturalWidth||1, naturalHeight: img.naturalHeight||1 });
    img.onerror = ()=> reject(new Error("이미지 크기를 읽지 못했어요."));
    img.src = src;
  });
}

/* 새 이미지 레이어에 넣을 기본 위치/크기 값 (원본 가로세로 비율을 유지) */
function makeImageLayer(src, naturalWidth, naturalHeight){
  const aspect = (naturalHeight && naturalWidth) ? (naturalHeight / naturalWidth) : 1.25;
  const wFrac = 0.5; // 카드 가로폭의 50%로 시작
  const hFrac = wFrac * 0.8 * aspect; // 카드 비율(4:5=0.8) 보정
  return {
    id: "img-"+Date.now()+"-"+Math.random().toString(36).slice(2,6),
    type: "image", src, x: 50, y: 50, wFrac, hFrac, aspect,
  };
}

/* 카드뉴스 대본 초안 단계에서 "이미지·차트 넣을 자리 남기기"를 체크했는데 AI가 실제 표로 뽑을 데이터를
   못 찾은 슬라이드에 자동으로 들어가는, 아직 채워지지 않은 이미지 자리(점선 박스). src가 없는 것만 다르고
   나머지는 일반 이미지 레이어와 동일해서 드래그로 위치를 옮길 수 있다 — 실제로 채우려면 이 레이어를
   지우고 "+ 이미지 추가"나 이미지 검색으로 새로 넣으면 된다. */
function makePlaceholderImageLayer(){
  return {
    id: "img-"+Date.now()+"-"+Math.random().toString(36).slice(2,6),
    type: "image", src: null, x: 50, y: 80, wFrac: 0.6, hFrac: 0.45, aspect: 0.75,
  };
}

async function tryConvertToDataURL(url){
  try{
    const res = await fetch(url, { mode:"cors" });
    if(!res.ok) throw new Error("이미지 응답 실패");
    const blob = await res.blob();
    return await new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = ()=> resolve(reader.result);
      reader.onerror = ()=> reject(reader.error);
      reader.readAsDataURL(blob);
    });
  }catch(e){
    return url; // CORS 등으로 실패하면 원본 URL을 그대로 사용 (미리보기는 되지만 PNG 다운로드 시 문제가 될 수 있음)
  }
}

/* 누끼 따기(배경 제거): @imgly/background-removal을 브라우저 안에서만 돌려서
   서버 비용/이미지 유출 없이 처리한다. 첫 실행 때만 인식 모델(수십MB)을 받고,
   그 다음부턴 브라우저 캐시에 남아서 빨라진다. 스크립트 태그로 미리 불러오지 않고
   실제로 눌렀을 때만 동적 import 하도록 해서 평소 페이지 로딩을 무겁게 만들지 않는다. */
const BG_REMOVAL_CDN_URL = "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/dist/index.mjs";
let _bgRemovalModulePromise = null;
function loadBgRemovalModule(){
  if(!_bgRemovalModulePromise) _bgRemovalModulePromise = import(BG_REMOVAL_CDN_URL);
  return _bgRemovalModulePromise;
}

function loadBlobAsImage(blob){
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = ()=>{ URL.revokeObjectURL(url); resolve(img); };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error("이미지를 불러오지 못했어요.")); };
    img.src = url;
  });
}

function clampByte(v){ return v<0?0:(v>255?255:Math.round(v)); }

/* 배경 제거 모델이 만든 알파 마스크는 가장자리 픽셀이 완전히 투명(0)하지도
   완전히 불투명(255)하지도 않은 "부분 투명" 상태로 남는데, 그 픽셀의 RGB는
   실제로는 "전경색과 원래 배경색이 섞인 색"이다(예: 흰 배경 위 주황 고양이의
   가장자리 픽셀은 흰색+주황이 섞인 연한 색). 그래서 카드의 새 배경 위에 올리면
   원래 사진의 배경색이 옅게 비쳐서 테두리 선/얼룩처럼 보인다.
   전에는 알파 채널을 침식(erosion)해서 가장자리를 통째로 깎아내는 방식을 썼는데,
   실제 사진(특히 아웃포커싱된 배경)에서는 이 "부분 투명" 구간이 수십~100px씩
   넓게 나타날 수 있어서, 침식 반경을 그 정도로 키우면 피사체 자체가 깎여나가
   버린다 — 그래서 테두리가 계속 남는다는 사용자 피드백을 받고 접근을 바꿈.
   지금은 침식 대신, 원본 사진에서 "진짜 배경"으로 확정된 픽셀(마스크 알파=0)의
   색을 가져와 가까운 부분투명 픽셀에 전파(BFS)한 뒤, 알파-블렌딩 공식을 거꾸로
   풀어서(언믹싱) 그 픽셀에서 배경색 기여분을 제거한다. 알파 값 자체(피사체
   모양)는 그대로 두고 "색"만 고쳐서, 소프트한 가장자리는 유지하면서 배경색
   번짐만 없앤다. */
function decontaminateCutoutEdges(cutoutCanvas, originalImg){
  const ctx = cutoutCanvas.getContext("2d");
  const { width, height } = cutoutCanvas;
  const cutoutData = ctx.getImageData(0, 0, width, height);
  const alphaData = cutoutData.data;

  // 원본 사진을 같은 크기로 그려서, 마스크가 지워버린 자리의 "진짜" 색을 얻는다
  // (배경 제거 결과물 자체는 알파=0인 픽셀의 RGB를 0으로 지워버리기 때문에 못 씀)
  const srcCanvas = document.createElement("canvas");
  srcCanvas.width = width; srcCanvas.height = height;
  const srcCtx = srcCanvas.getContext("2d");
  srcCtx.drawImage(originalImg, 0, 0, width, height);
  const srcData = srcCtx.getImageData(0, 0, width, height).data;

  const n = width * height;
  const alpha = new Uint8ClampedArray(n);
  for(let i=0;i<n;i++) alpha[i] = alphaData[i*4+3];

  const ZERO = 15;   // 이 이하는 어차피 거의 안 보이므로 아예 투명 처리(불안정한 언믹싱 계산을 피함)
  const HIGH = 235;  // 이 이상은 확실한 전경으로 보고 손대지 않음(모델이 정확히 255를 잘 안 주기 때문)

  // 알파=0(확정 배경)인 자리의 원본 색을, 인접한 부분투명 픽셀들로 BFS 전파해서
  // 각 부분투명 픽셀이 "실제로 섞였을 배경색"을 추정한다
  const bgR = new Int16Array(n).fill(-1);
  const bgG = new Int16Array(n).fill(-1);
  const bgB = new Int16Array(n).fill(-1);
  const queue = [];
  for(let i=0;i<n;i++){
    if(alpha[i] === 0){
      bgR[i] = srcData[i*4]; bgG[i] = srcData[i*4+1]; bgB[i] = srcData[i*4+2];
      queue.push(i);
    }
  }
  let qi = 0;
  while(qi < queue.length){
    const idx = queue[qi++];
    const x = idx % width;
    const r = bgR[idx], g = bgG[idx], b = bgB[idx];
    const candidates = [idx-1, idx+1, idx-width, idx+width];
    for(const nIdx of candidates){
      if(nIdx < 0 || nIdx >= n) continue;
      const nx = nIdx % width;
      if(Math.abs(nx - x) > 1) continue; // 가로 줄바꿈 경계 넘어가는 것 방지
      if(bgR[nIdx] !== -1) continue;
      if(alpha[nIdx] >= HIGH) continue; // 확실한 전경 안쪽까지는 전파 안 함
      bgR[nIdx] = r; bgG[nIdx] = g; bgB[nIdx] = b;
      queue.push(nIdx);
    }
  }

  // 언믹싱: observed = alpha*fg + (1-alpha)*bg 라고 보고 fg를 역산
  for(let i=0;i<n;i++){
    const a = alpha[i];
    if(a === 0 || a >= HIGH) continue;
    if(a <= ZERO){ alphaData[i*4+3] = 0; continue; }
    if(bgR[i] === -1) continue; // 배경색 추정 실패 — 보수적으로 그대로 둠
    const af = a / 255;
    const r = srcData[i*4], g = srcData[i*4+1], b = srcData[i*4+2];
    alphaData[i*4]   = clampByte((r - (1-af)*bgR[i]) / af);
    alphaData[i*4+1] = clampByte((g - (1-af)*bgG[i]) / af);
    alphaData[i*4+2] = clampByte((b - (1-af)*bgB[i]) / af);
  }
  ctx.putImageData(cutoutData, 0, 0);
}

async function postProcessCutoutBlob(cutoutBlob, originalImg){
  const cutoutImg = await loadBlobAsImage(cutoutBlob);
  const canvas = document.createElement("canvas");
  canvas.width = cutoutImg.naturalWidth;
  canvas.height = cutoutImg.naturalHeight;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(cutoutImg, 0, 0);
  decontaminateCutoutEdges(canvas, originalImg);
  return await new Promise(resolve=> canvas.toBlob(resolve, "image/png"));
}

async function removeImageLayerBackground(idx, layerId){
  const ed = state.cardEditor;
  if(!ed || ed.bgRemoval) return; // 이미 처리 중이면 중복 실행 방지
  const slide = state.cardPipeline.cardNews && state.cardPipeline.cardNews.slides[idx];
  const layer = slide && (slide.layers||[]).find(l=>l.id===layerId);
  if(!layer || !layer.src) return;
  ed.bgRemoval = { layerId, message: "모델 준비 중..." };
  render();
  try{
    const mod = await loadBgRemovalModule();
    const sourceBlob = await fetch(layer.src).then(r=>r.blob());
    const originalImg = await loadBlobAsImage(sourceBlob);
    const rawResultBlob = await mod.removeBackground(sourceBlob, {
      model: "isnet_quint8", // 가장 작은 모델(~40MB) — 다운로드 부담을 줄이는 쪽을 우선
      progress: (key, current, total)=>{
        if(ed.bgRemoval) ed.bgRemoval.message = "처리 중... (" + key + ")";
        render();
      },
    });
    if(ed.bgRemoval) ed.bgRemoval.message = "가장자리 다듬는 중...";
    render();
    const resultBlob = await postProcessCutoutBlob(rawResultBlob, originalImg);
    const resultDataUrl = await readFileAsDataURL(resultBlob);
    if(!layer.srcBeforeCutout) layer.srcBeforeCutout = layer.src;
    layer.src = resultDataUrl;
  }catch(e){
    alert("배경 제거에 실패했어요: " + e.message);
  }
  ed.bgRemoval = null;
  render();
}

function revertImageLayerCutout(idx, layerId){
  const slide = state.cardPipeline.cardNews && state.cardPipeline.cardNews.slides[idx];
  const layer = slide && (slide.layers||[]).find(l=>l.id===layerId);
  if(!layer || !layer.srcBeforeCutout) return;
  layer.src = layer.srcBeforeCutout;
  layer.srcBeforeCutout = null;
  render();
}

async function runCardImageSearch(){
  const ed = state.cardEditor;
  const is = ed && ed.imageSearch;
  if(!is) return;
  const inputEl = document.getElementById("image-search-input");
  const query = inputEl ? inputEl.value.trim() : (is.query||"");
  if(!query) return;
  is.query = query; is.loading = true; is.error = ""; is.results = [];
  render();
  try{
    const res = await fetch("https://api.openverse.org/v1/images/?q="+encodeURIComponent(query)+"&page_size=12");
    if(!res.ok) throw new Error("상태 " + res.status);
    const data = await res.json();
    is.results = (data.results||[]).map(r=>({
      thumb: r.thumbnail || r.url,
      full: r.url,
      title: r.title || "",
    })).filter(r=>r.full);
    if(!is.results.length) is.error = "검색 결과가 없어요. 다른 검색어로 시도해보세요.";
  }catch(e){
    // Openverse는 우리가 운영하는 서비스가 아니라, 가끔 그쪽 서버 자체가 다운되는 경우가 있다(504 등).
    // 그럴 땐 재시도해도 안 되니, 보관함/직접 업로드로 유도하는 안내를 보여준다.
    is.error = "이미지 검색에 실패했어요 (" + e.message + "). Openverse 서비스 자체에 일시적 문제가 있을 수 있어요 — 잠시 후 다시 시도하거나, 위 '📁 보관함' 탭이나 '+ 이미지 추가'로 직접 올려보세요.";
  }
  is.loading = false;
  render();
}

async function applyCardImageSearchPick(resultIdx){
  const ed = state.cardEditor;
  const is = ed && ed.imageSearch;
  if(!is || !is.results) return;
  const picked = is.results[resultIdx];
  if(!picked) return;
  const idx = ed.slideIdx;
  const slide = state.cardPipeline.cardNews && state.cardPipeline.cardNews.slides[idx];
  if(!slide) return;
  const purpose = is.purpose;
  ed.imageSearch = null;
  render();
  const src = await tryConvertToDataURL(picked.full);
  if(purpose === "bg"){
    slide.bgImage = src;
  } else {
    const dims = await loadImageDims(src).catch(()=>({naturalWidth:1,naturalHeight:1.25}));
    const newLayer = makeImageLayer(src, dims.naturalWidth, dims.naturalHeight);
    if(!slide.layers) slide.layers = [];
    slide.layers.push(newLayer);
    ed.selectedLayer = newLayer.id;
  }
  render();
}

async function ensureFontsReady(){
  try{ if(document.fonts && document.fonts.ready) await document.fonts.ready; }catch(e){}
}

function createOffscreenCardNode(slide, idx, total, brand){
  const w = 1080, h = 1350;
  const holder = document.createElement("div");
  holder.style.position = "fixed";
  holder.style.left = "-99999px";
  holder.style.top = "0";
  holder.style.zIndex = "-1";
  holder.innerHTML = buildCardMarkup(slide, idx, total, brand, w, h);
  document.body.appendChild(holder);
  return holder;
}

async function captureCardToCanvas(slide, idx, total, brand){
  await ensureFontsReady();
  const node = createOffscreenCardNode(slide, idx, total, brand);
  try{
    applyDynamicFlow(node.firstElementChild, slide);
    const canvas = await html2canvas(node.firstElementChild, { backgroundColor:null, scale:1, useCORS:true });
    return canvas;
  } finally {
    document.body.removeChild(node);
  }
}

async function downloadSingleCard(idx){
  const p = state.cardPipeline;
  const cn = p.cardNews;
  if(!cn || !cn.slides[idx]) return;
  const btn = document.querySelector(`[data-download-card="${idx}"]`);
  const originalLabel = btn ? btn.textContent : "";
  if(btn){ btn.disabled = true; btn.textContent = "생성 중..."; }
  try{
    const canvas = await captureCardToCanvas(cn.slides[idx], idx, cn.slides.length, state.brandSettings);
    const url = canvas.toDataURL("image/png");
    const a = document.createElement("a");
    a.href = url; a.download = "cardnews-"+String(idx+1).padStart(2,"0")+".png"; a.click();
  }catch(e){
    alert("이미지 생성 중 문제가 생겼어요: " + e.message);
  }
  if(btn){ btn.disabled = false; btn.textContent = originalLabel; }
}

async function downloadAllCardsZip(){
  const p = state.cardPipeline;
  const cn = p.cardNews;
  if(!cn || !cn.slides.length) return;
  const btn = document.getElementById("download-all-cards-btn");
  if(btn){ btn.disabled = true; }
  try{
    const zip = new JSZip();
    for(let i=0;i<cn.slides.length;i++){
      if(btn) btn.textContent = "생성 중... ("+(i+1)+"/"+cn.slides.length+")";
      const canvas = await captureCardToCanvas(cn.slides[i], i, cn.slides.length, state.brandSettings);
      const dataUrl = canvas.toDataURL("image/png");
      const base64 = dataUrl.split(",")[1];
      zip.file("cardnews-"+String(i+1).padStart(2,"0")+".png", base64, {base64:true});
    }
    const blob = await zip.generateAsync({type:"blob"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "cardnews.zip"; a.click();
  }catch(e){
    alert("ZIP 생성 중 문제가 생겼어요: " + e.message);
  }
  if(btn){ btn.disabled = false; btn.textContent = "🖼️ 전체 카드뉴스 ZIP 다운로드"; }
}

function reelsScriptToText(r){
  const lines = [`[오프닝 훅] ${r.hook||""}`, ""];
  (r.scenes||[]).forEach((sc,i)=>{
    lines.push(`${i+1}. ${sc.timeRange||""}`);
    lines.push(`   내레이션: ${sc.narration||""}`);
    lines.push(`   화면: ${sc.visual||""}${sc.onScreenText ? "  /  자막: "+sc.onScreenText : ""}`);
    lines.push("");
  });
  lines.push(`[CTA] ${r.cta||""}`);
  return lines.join("\n");
}

/* 카테고리별 톤/용어/광고규정 가이드를 프롬프트에 주입 */
/* 카드뉴스 글 분량 설정(컴팩트/중간/많게)에 따라 AI에게 줄 지침 문구 */
function densityInstruction(density){
  if(density === "compact"){
    return `핵심만 아주 간결하게. 각 슬라이드는 반드시 구체적인 사실/포인트 딱 1개만 담고, 배경 설명이나 부연은 과감히 생략해. 문장은 최대한 짧게(한 문장 12~18자 내외), 보조설명은 1~2줄을 넘기지 마. 추상적인 말 대신 원문의 가장 핵심적인 수치·조건 하나만 골라서 써.`;
  }
  if(density === "full"){
    return `칼럼 본문에 있는 정보·사례·수치·절차·예외사항을 하나도 빠짐없이 전부 반영해. 요약하거나 생략하지 말고, 필요하면 슬라이드 여러 장에 나눠서라도 원문의 모든 내용을 다뤄. 각 슬라이드의 보조설명은 2~4개의 포인트로 나눠서(줄바꿈으로 구분) 자세히 적어도 좋아 — 다만 각 포인트 문장 자체는 여전히 짧고 읽기 쉽게 끊어 써.`;
  }
  return `핵심 정보 위주로 적당히 상세하게. 슬라이드당 메인 포인트 1개 + 보조 설명 1~2문장 정도가 기본이고, 필요하면 짧은 포인트 2~3개를 줄바꿈으로 나눠 적어도 좋아. 너무 함축하거나 너무 장황하지 않게 균형을 맞춰.`;
}

function writingPersonaPrompt(){
  // 아래 원칙은 문체·말투와 무관하게(정중하든 캐주얼하든 비속어가 섞이든) 예외 없이 지켜야 하는 것들만 남겨뒀다.
  // 말투 자체를 여기서 "차분하고 단정하게"로 못박아두면 사용자가 스타일 가이드에 캐주얼한 톤을 적어도 씹혀버려서,
  // 톤에 대한 지시는 전부 스타일 가이드/카드뉴스 스타일 프롬프트에 맡긴다.
  let base = `너는 금융·법률 관련 콘텐츠를 쓰는 마케팅 카피라이터야. 문체·어조·말투(정중함, 캐주얼함, 반말, 비속어 섞기 등)는 아래 [글쓰기 스타일 가이드]가 있으면 그걸 그대로 따르고, 없으면 차분하고 신뢰감 있는 기본 어조로 써. 다만 문체와 무관하게 아래는 절대 어기지 마:
- 결과·수익·성공·면책을 보장하거나 확정적으로 말하지 마 ("무조건 됩니다", "100% 가능", "이것만 알면 끝" 같은 결과 보장성 문구 금지)
- 원본 내용에 없는 사실이나 수치를 지어내지 마 — 주어진 소재를 충실히 반영할 것
- 실제 근거 없는 급박함을 강요하는 문구(허위 마감 압박 등)는 쓰지 마
- 대한변호사협회 변호사 광고에 관한 규정, 표시광고법 등 관련 광고 규정에서 금지하는 표현은 피할 것`;
  if(state.styleGuide && state.styleGuide.trim()){
    base += `\n\n[우리 사무소 글쓰기 스타일 가이드 - 반드시 따를 것]\n${state.styleGuide.trim()}`;
  }
  return base;
}

/* =========================================================
   AI가 JSON 대신 태그 구분자 형식으로 답하게 해서,
   본문 안에 따옴표/줄바꿈이 섞여도 파싱이 깨지지 않게 한다.
   (JSON은 자유 서술형 한국어 텍스트를 넣으면 이스케이프 문제로 자주 깨짐)
========================================================= */
function parseTaggedSections(text){
  const sections = {};
  const regex = /###([A-Z_]+)###/g;
  const matches = [];
  let m;
  while((m = regex.exec(text)) !== null){
    matches.push({ name: m[1], start: m.index, contentStart: regex.lastIndex });
  }
  for(let i=0;i<matches.length;i++){
    const contentEnd = (i+1<matches.length) ? matches[i+1].start : text.length;
    sections[matches[i].name] = text.slice(matches[i].contentStart, contentEnd).trim();
  }
  return sections;
}

function extractBetween(text, startMarker, endMarker){
  const s = text.indexOf(startMarker);
  const e = text.indexOf(endMarker);
  if(s<0 || e<0 || e<s) return "";
  return text.slice(s+startMarker.length, e);
}

  const persona = writingPersonaPrompt();
  let sourceText = p.sourceText;

  if(p.inputMode === "url"){

    const data = await res.json().catch(()=>({}));

  } else if(p.inputMode === "youtube"){

    const data = await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.error || "유튜브 영상에서 자막을 가져오지 못했어요.");
    sourceText = (data.title ? `(영상 제목: ${data.title})\n\n` : "") + data.text;
  }

  const sourceInstruction = `아래는 참고용 원본 ${p.inputMode==="youtube" ? "영상 자막" : "칼럼"} 텍스트야.
- 원문에 나온 핵심 정보·사실관계·수치·사례·주장은 반드시 그대로 살려서 내용이 원문과 이어지도록 써. 내용을 임의로 다른 주제로 바꾸거나 원문에 없는 내용을 지어내면 안 돼.
- 다만 문장 표현, 단어 선택, 문단 구성은 원문 그대로 베끼지 말고 전부 새로운 문장으로 다시 써. (표현만 새로 쓰고, 담긴 내용/논지는 원문에 충실할 것)
${p.inputMode==="youtube" ? "- 원문은 영상 자막이라 구어체이고 문단 구분이 없거나 말이 반복/생략될 수 있어. 핵심 내용만 골라서 글로 읽기 좋은 칼럼 형태(문단 구분, 완결된 문장)로 정리해." : ""}

[원본 ${p.inputMode==="youtube" ? "자막" : "칼럼"}]
${sourceText}`;

  const prompt = `너는 법률 마케팅 전문 카피라이터야. ${persona}

${sourceInstruction}

출력은 아래 형식을 정확히 그대로 따라서 작성해. JSON이나 마크다운 코드블록, 그 밖의 설명은 절대 붙이지 말고 이 형식만 출력해. 각 구분자(###로 시작하는 줄)는 반드시 단독으로 한 줄에 적어.

###TITLE###
(새로 지은 칼럼 제목 한 줄)
###BODY###
(본문 전체. 5~8문단, 문단 사이는 빈 줄로 구분)
###KEYPOINTS###
(핵심 포인트 1)
(핵심 포인트 2)
(핵심 포인트 3)
###TAGS###
태그1, 태그2, 태그3, 태그4
###END###`;
  const raw = await callBackendAI(prompt, false, 4000);
  const sections = parseTaggedSections(raw);
  return {
    title: (sections.TITLE || "").trim(),
    body: (sections.BODY || "").trim(),
    keyPoints: (sections.KEYPOINTS || "").split("\n").map(s=>s.replace(/^[-*\d.\s]+/, "").trim()).filter(Boolean),
    tags: (sections.TAGS || "").split(",").map(s=>s.trim().replace(/^#/, "")).filter(Boolean),
  };
}

/* 실제 카드뉴스를 만들기 전, 슬라이드별로 어떤 내용을 다룰지 먼저 간단히 구성안(대본 초안)만 짜준다.
   p: state.cardPipeline, c: {title, body} 형태로 정리된 원고(baseContent) */
async function generateCardOutline(p, c){
  const persona = writingPersonaPrompt();
  const count = Math.max(1, Math.min(20, Number(p.slideCount) || 8));
  const density = p.cardDensity || "medium";
  const densityNote = densityInstruction(density);
  const customPrompt = (state.cardNewsPrompt||"").trim();
  const customPromptBlock = customPrompt ? `\n\n[카드뉴스 스타일 프롬프트]\n${customPrompt}` : "";

  const prompt = `너는 인스타그램 카드뉴스 기획자야. ${persona}${customPromptBlock}

아직 실제 문구를 쓰지 말고, 아래 내용을 ${count}장짜리 카드뉴스로 만들기 위한 "슬라이드별 구성안"만 짜줘. 각 슬라이드가 다룰 내용을 한두 문장으로 요약하면 돼.

[분량 기준 - 이 구성안에도 반영할 것]
${densityNote}

1번 슬라이드는 시선을 끄는 표지, ${count}번(마지막) 슬라이드는 상담 유도 CTA, 나머지는 본문이야. 본문 슬라이드들은 서로 겹치지 않게 각자 다른 내용을 다루도록 순서있게 구성해. 정확히 ${count}개를 만들어야 해.

[제목]
${c.title}

[본문]
${c.body}

출력 형식을 정확히 그대로 따라. 다른 설명 붙이지 마. 각 슬라이드는 "###ITEM###" 한 줄로 시작하고, 다음 줄에 그 슬라이드가 다룰 내용 요약을 적어. 모두 끝나면 "###END###".

###ITEM###
(1번 슬라이드 내용 요약)
###ITEM###
(2번 슬라이드 내용 요약)
###END###`;

  const maxTokens = Math.min(4000, Math.max(1200, count * 130));
  const raw = await callBackendAI(prompt, false, maxTokens);
  const endIdx = raw.indexOf("###END###");
  const trimmed = endIdx>=0 ? raw.slice(0, endIdx) : raw;
  let parts = trimmed.split("###ITEM###").map(s=>s.trim()).filter(Boolean);
  if(parts.length > count) parts = parts.slice(0, count);
  while(parts.length < count) parts.push("");
  return parts.map((topic, idx) => ({
    no: idx+1,
    role: idx===0 ? "cover" : (idx===count-1 ? "cta" : "content"),
    topic: topic || "",
    hasVisual: false,
  }));
}

아래 내용을 정확히 ${count}장짜리 카드뉴스 대본으로 각색해.

[퀄리티 기준 - 반드시 지킬 것]

8. 보조설명에서 서로 구분되는 포인트가 여러 개면, 문장을 이어붙이지 말고 줄바꿈으로 나눠서 각각 짧은 항목으로 적어(카드에서 항목별로 구분선을 넣어 보여줘). 포인트가 하나뿐이면 그냥 한 문단으로 적어도 돼. 모든 슬라이드를 항목 나열식으로 통일하지 말고, 내용에 따라 한 문단으로 자연스럽게 풀어 쓰는 슬라이드도 섞어서 단조롭지 않게 해.
9. 슬라이드 안에 눈에 띄게 강조하고 싶은 핵심 수치나 한 줄 요약이 있을 때만 보조설명 다음 줄에 "HIGHLIGHT: 강조할 내용"을 추가해. 모든 슬라이드(마지막 CTA 슬라이드 포함)에 억지로 넣을 필요 없음 — 정말 강조할 만한 내용이 없으면 그냥 안 써도 돼. CTA 문구를 쓸 때는 "구체적인 신청 가능 여부는 상담을 통해 확인할 수 있습니다"처럼 담백하게, 결과를 보장하는 톤은 피해.
10. "이미지/차트 자리가 필요한 슬라이드"로 표시된 슬라이드는: 그 슬라이드가 다루는 내용 안에 실제로 항목별로 비교되는 값·조건·수치가 2개 이상 있으면(원문에 실제로 있는 것만! 지어내지 마), 보조설명 뒤에 "TABLE: 항목1=값1 | 항목2=값2 | 항목3=값3" 형식으로 그 실제 값들을 정리해서 적어. 그런 표로 정리할 만한 실제 데이터가 없으면 TABLE 줄을 절대 쓰지 말고, 그냥 보조설명만 평소보다 짧게 써서 사진이 들어갈 여백을 남겨.

출력은 아래 형식을 정확히 그대로 따라서 작성해. JSON이나 마크다운, 다른 설명 없이 이 형식만 출력해. 각 슬라이드는 "###SLIDE###" 한 줄로 시작하고, 그 다음 줄에 헤드라인 한 줄, 그 다음 줄부터 보조설명(그리고 필요하면 HIGHLIGHT 줄, 그리고 위 10번 조건에 맞으면 TABLE 줄)을 적어. 모든 슬라이드가 끝나면 마지막에 "###END###"를 적어.

[제목]
${c.title}

[본문]
${c.body}

예시 형식:
###SLIDE###
헤드라인 한 줄
보조설명 포인트 1
보조설명 포인트 2
HIGHLIGHT: 강조할 한 줄 (있을 때만)
TABLE: 항목1=값1 | 항목2=값2 (이미지/차트 자리 슬라이드에서 실제 비교 데이터가 있을 때만)
###SLIDE###
다음 헤드라인
다음 보조설명
###END###`;
  // 예전엔 분량(density)과 상관없이 토큰 한도가 고정이라, "컴팩트"를 골라도 모델이 넉넉한 공간을 다 채우려는 경향 때문에
  // 대본 초안은 짧게 나와도 실제 완성된 카드뉴스는 길게 나오는 버그가 있었다. 분량별로 한도 자체를 줄여서 고쳤다.
  const tokenBudgetPerSlide = density === "compact" ? 160 : (density === "full" ? 420 : 300);
  const tokenBudgetMin = density === "compact" ? 900 : (density === "full" ? 2800 : 2200);
  const maxTokens = Math.min(8000, Math.max(tokenBudgetMin, count * tokenBudgetPerSlide));
  const raw = await callBackendAI(prompt, false, maxTokens);
  const endIdx = raw.indexOf("###END###");
  const trimmed = endIdx>=0 ? raw.slice(0, endIdx) : raw;
  let parts = trimmed.split("###SLIDE###").map(s=>s.trim()).filter(Boolean);
  if(parts.length > count) parts = parts.slice(0, count); // 혹시 더 많이 나오면 앞에서부터 잘라 개수를 맞춘다
  const slides = parts.map((part, idx) => {
    const lines = part.split("\n");
    const headline = (lines[0]||"").trim();
    const bodyLines = [];
    let highlight = "";
    let tableRows = null;
    for(let i=1;i<lines.length;i++){
      const trimmedLine = lines[i].trim();
      if(/^HIGHLIGHT:/i.test(trimmedLine)){
        highlight = trimmedLine.replace(/^HIGHLIGHT:/i, "").trim();
      } else if(/^TABLE:/i.test(trimmedLine)){
        // "항목1=값1 | 항목2=값2" 형식을 파싱. 원문에 실제 있는 값만 AI가 넣도록 프롬프트에서 지시했음 — 여기서 지어내지 않는다.
        const pairs = trimmedLine.replace(/^TABLE:/i, "").trim().split("|")
          .map(seg => {
            const eqIdx = seg.indexOf("=");
            if(eqIdx < 0) return null;
            return { label: seg.slice(0, eqIdx).trim(), value: seg.slice(eqIdx+1).trim() };
          })
          .filter(row => row && row.label && row.value);
        if(pairs.length) tableRows = pairs;
      } else {
        bodyLines.push(lines[i]);
      }
    }
    const subtext = bodyLines.join("\n").trim();
    const isCta = idx === count-1;
    const align = isCta ? "center" : "left";
    const hasVisual = outline && outline[idx] ? !!outline[idx].hasVisual : false;
    const layout = computeInitialSlideLayout(headline, subtext, idx===0, isCta, hasVisual);
    const layers = [
      { id:"headline", type:"headline", text: headline, x:50, y: layout.headlineY, scale:1, align },
      { id:"subtext", type:"subtext", text: subtext, x:50, y: layout.subtextY, scale:1, align },
      ...makeChromeLayers(idx, count, state.brandSettings),
    ];
    // "이미지/차트 자리가 필요한 슬라이드"인데 아직 이미지가 없으면: 실제 데이터로 뽑아낸 표가 있으면 표를 자동으로 넣고,
    // 없으면 사진을 나중에 채워 넣을 자리(점선 박스)를 시각적으로 남겨서 체크 여부가 카드에 실제로 드러나게 한다.
    // computeInitialSlideLayout이 텍스트 밴드를 미리 줄여둬서 여기 아래에 실제로 겹치지 않는 공간이 있다.
    if(hasVisual){
      const visualY = layout.visualY || 82;
      if(tableRows){
        layers.push({ id:"table-"+Date.now()+"-"+Math.random().toString(36).slice(2,6), type:"table", rows: tableRows, x:50, y:visualY, scale:1 });
      } else {
        const ph = makePlaceholderImageLayer();
        ph.y = visualY;
        ph.hFrac = layout.visualHFrac || 0.22;
        ph.wFrac = Math.min(0.84, ph.hFrac / 0.7);
        layers.push(ph);
      }
    }
    return {
      no: idx+1, headline, subtext, highlight, plannedVisual: hasVisual,
      bgImage: state.cardDefaultBgImage || null,
      bgImageOpacity: state.cardDefaultBgImage ? (state.cardDefaultBgOpacity!=null?state.cardDefaultBgOpacity:100) : null,
      layers,
    };
  });
  // 혹시 모자라게 나오면 빈 슬라이드로 채워서 사용자가 지정한 장수를 맞춘다 (직접 텍스트를 채워넣으면 됨)
  while(slides.length < count){
    const idx = slides.length;
    const isCta = idx === count-1;
    const align = isCta ? "center" : "left";
    const layout = computeInitialSlideLayout("", "", idx===0, isCta);
    slides.push({
      no: idx+1, headline: "", subtext: "", highlight: "", plannedVisual: false,
      bgImage: state.cardDefaultBgImage || null,
      bgImageOpacity: state.cardDefaultBgImage ? (state.cardDefaultBgOpacity!=null?state.cardDefaultBgOpacity:100) : null,
      layers: [
        { id:"headline", type:"headline", text:"", x:50, y: layout.headlineY, scale:1, align },
        { id:"subtext", type:"subtext", text:"", x:50, y: layout.subtextY, scale:1, align },
        ...makeChromeLayers(idx, count, state.brandSettings),
      ],
    });
  }
  return { slides };
}

async function generateReelsScriptFn(){
  const p = state.pipeline;
  const c = p.rewrittenColumn;
  const persona = writingPersonaPrompt();
  const prompt = `너는 숏폼(릴스/쇼츠) 대본 작가야. ${persona}

아래 칼럼을 30~45초 분량의 릴스 대본으로 각색해. 처음 3초 안에 시선을 끄는 훅으로 시작하고, 장면은 3~6개로 나누고, 마지막은 상담 유도 CTA로 마무리해.

[칼럼 제목]
${c.title}

[칼럼 본문]
${c.body}

출력은 아래 형식을 정확히 그대로 따라서 작성해. JSON이나 마크다운, 다른 설명 없이 이 형식만 출력해. 각 구분자(###로 시작하는 줄)는 반드시 단독으로 한 줄에 적어.

###HOOK###
(오프닝 3초 안에 말할 대사)
###DURATION###
(전체 길이, 숫자만, 예: 40)
###SCENES_START###
###SCENE###
(타임레인지, 예: 0:03-0:10)
(이 구간 내레이션 대사)
(화면에 보여줄 장면 연출 설명)
(화면에 띄울 자막 문구)
###SCENE###
(다음 장면도 위와 같은 4줄 형식으로 반복)
###SCENES_END###
###CTA###
(마지막 상담 유도 멘트)
###END###`;
  const raw = await callBackendAI(prompt, false, 3500);
  const scenesBlock = extractBetween(raw, "###SCENES_START###", "###SCENES_END###");
  const headerAndFooter = raw.split("###SCENES_START###")[0]
    + (raw.includes("###SCENES_END###") ? raw.split("###SCENES_END###")[1] : "");
  const header = parseTaggedSections(headerAndFooter);
  const sceneParts = scenesBlock.split("###SCENE###").map(s=>s.trim()).filter(Boolean);
  const scenes = sceneParts.map(part => {
    const lines = part.split("\n").map(l=>l.trim());
    return {
      timeRange: lines[0] || "",
      narration: lines[1] || "",
      visual: lines[2] || "",
      onScreenText: lines[3] || "",
    };
  });
  return {
    hook: (header.HOOK || "").trim(),
    durationSec: parseInt((header.DURATION || "").trim(), 10) || 30,
    cta: (header.CTA || "").trim(),
    scenes,
  };
}

/* 카드뉴스 파이프라인 전용: URL/유튜브 입력이면 원문을 가져오고, 텍스트 입력이면 그대로 반환 (칼럼 재작성과 별개로 동작) */
async function resolveCardSourceText(p){
  if(p.inputMode === "url"){
    const res = await fetch("/api/fetch-url?url=" + encodeURIComponent(p.sourceUrl));
    if(res.status === 401){ redirectToLogin(); throw new Error("로그인이 필요해요."); }
    const data = await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.error || "URL에서 원문을 가져오지 못했어요.");
    return data.text;
  }
  if(p.inputMode === "youtube"){
    const res = await fetch("/api/youtube-transcript?url=" + encodeURIComponent(p.sourceUrl));
    if(res.status === 401){ redirectToLogin(); throw new Error("로그인이 필요해요."); }
    const data = await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.error || "유튜브 영상에서 자막을 가져오지 못했어요.");
    return (data.title ? `(영상 제목: ${data.title})\n\n` : "") + data.text;
  }
  return p.sourceText;
}

/* 카드뉴스 대본 초안을 만들기 전, 입력된 원문을 카드뉴스에 쓰기 좋은 제목·본문으로 내부적으로 정리한다.
   (칼럼 재작성과 달리 별도 화면 단계로 보여주지 않고, "카드뉴스 대본 만들기" 한 번에 이어서 처리한다) */
async function generateCardBaseContent(p){
  const persona = writingPersonaPrompt();
  const sourceText = await resolveCardSourceText(p);

  const sourceInstruction = `아래는 참고용 원본 ${p.inputMode==="youtube" ? "영상 자막" : "텍스트"}야.
- 원문에 나온 핵심 정보·사실관계·수치·사례·주장은 반드시 그대로 살려. 내용을 임의로 다른 주제로 바꾸거나 원문에 없는 내용을 지어내면 안 돼.
- 문장 표현은 원문 그대로 베끼지 말고, 카드뉴스 슬라이드에 쓰기 좋게 새로 정리해서 써.
${p.inputMode==="youtube" ? "- 원문은 영상 자막이라 구어체이고 문단 구분이 없거나 말이 반복/생략될 수 있어. 핵심 내용만 골라서 정리해." : ""}

[원본 ${p.inputMode==="youtube" ? "자막" : "텍스트"}]
${sourceText}`;

  const prompt = `너는 법률 마케팅 전문 카피라이터야. ${persona}

${sourceInstruction}

이 내용을 카드뉴스로 만들기 좋게 제목과 본문으로 정리해줘. 출력은 아래 형식을 정확히 그대로 따라. JSON이나 마크다운, 다른 설명 없이 이 형식만 출력해.

###TITLE###
(카드뉴스 주제를 한 줄로)
###BODY###
(핵심 정보를 문단으로 정리한 본문. 3~6문단)
###END###`;
  const raw = await callBackendAI(prompt, false, 4000);
  const sections = parseTaggedSections(raw);
  return {
    title: (sections.TITLE || "").trim(),
    body: (sections.BODY || "").trim(),
  };
}

async function runCardDraftGeneration(){

  if(p.inputMode==="youtube" && !p.sourceUrl.trim()){ p.error = "유튜브 영상 링크를 입력해주세요."; render(); return; }

async function runNotionUpload(){
  const p = state.pipeline;
  if(!p.rewrittenColumn) return;
  p.loading.notion = true; p.error = null; p.notionUrl = null; render();
  try{
    const c = p.rewrittenColumn;
    const payload = { title: c.title, body: c.body, keyPoints: c.keyPoints, tags: c.tags };
    if(p.reelsScript){
      const rs = p.reelsScript;
      const sceneLines = (rs.scenes||[]).map((sc,i)=>
        `${i+1}. [${sc.timeRange||""}] ${sc.narration||""}${sc.onScreenText ? " (자막: "+sc.onScreenText+")" : ""}`
      );
      payload.extraSections = [{
        heading: "🎬 릴스 대본",
        paragraphs: [
          rs.hook ? "HOOK: " + rs.hook : "",
          "길이: 약 " + (rs.durationSec||30) + "초",
        ].filter(Boolean),
        bullets: sceneLines.concat(rs.cta ? ["CTA: " + rs.cta] : []),
      }];
    }
    p.notionUrl = await callBackendNotion(payload);
  }catch(e){
    p.error = "노션 업로드 중 문제가 생겼어요: " + e.message;
  }
  p.loading.notion = false;
  render();
}

async function saveColumnProject(){
  const p = state.pipeline;
  if(!p.rewrittenColumn) return;
  const now = new Date().toISOString();
  if(p.projectId){
    // 이미 저장된 프로젝트를 불러와 편집 중이면, 새로 만들지 않고 그 프로젝트를 최신 내용으로 갱신한다
    const item = state.columnProjects.find(x=>x.id===p.projectId);
    if(item){
      item.rewrittenColumn = p.rewrittenColumn;
      item.reelsScript = p.reelsScript;
      item.updatedAt = now;
    } else {
      // 원본이 삭제된 경우 새 항목으로 저장
      state.columnProjects.push({
        id: p.projectId, rewrittenColumn: p.rewrittenColumn,
        reelsScript: p.reelsScript, createdAt: now, updatedAt: now,
      });
    }
  } else {
    p.projectId = "colp-"+Date.now()+"-"+Math.random().toString(36).slice(2,7);
    state.columnProjects.push({
      id: p.projectId, rewrittenColumn: p.rewrittenColumn,
      reelsScript: p.reelsScript, createdAt: now, updatedAt: now,
    });
  }
  await saveColumnProjects();
  clearColumnDraftFromStorage(); // 이제 서버에 정식 저장됐으니 로컬 임시 초안은 정리
  // 발행 예정일을 지정했으면 콘텐츠 캘린더에도 자동 등록 (비워두면 기존 등록을 정리)
  if(p.publishDateStr){
    await upsertContentPlan({
      id: "cp-col-"+p.projectId,
      dateStr: p.publishDateStr,
      title: "📝 " + ((p.rewrittenColumn && p.rewrittenColumn.title) || "(제목 없음)"),
      product: "",
      contentType: "칼럼",
      planDetail: "콘텐츠 라이브러리에서 자동 연동된 칼럼 재구성 프로젝트",
      actualDetail: "",
      status: "plan",
      linkedEventId: null,
      createdAt: now,
    });
  } else {
    await removeContentPlan("cp-col-"+p.projectId);
  }
  p.savedJustNow = true;
  render();
  setTimeout(()=>{ state.pipeline.savedJustNow = false; render(); }, 2200);
}

/* ---- 콘텐츠 라이브러리: 저장된 칼럼·카드뉴스 프로젝트를 한 곳에서 검색·필터링 (읽기 전용 뷰, 기존 저장 목록과 별개) ---- */
function libraryItems(){
  const cols = state.columnProjects.map(item => ({
    type: "column", id: item.id,
    title: (item.rewrittenColumn && item.rewrittenColumn.title) || "(제목 없음)",
    tags: (item.rewrittenColumn && item.rewrittenColumn.tags) || [],
    createdAt: item.createdAt, updatedAt: item.updatedAt,
    hasReels: !!item.reelsScript,
    publishDateStr: (state.contentPlans.find(cp=>cp.id==="cp-col-"+item.id)||{}).dateStr || "",
  }));
  const cards = state.cardNewsProjects.map(item => ({
    type: "cardnews", id: item.id,
    title: (item.baseContent && item.baseContent.title) || "(제목 없음)",
    tags: [],
    createdAt: item.createdAt, updatedAt: item.updatedAt,
    slideCount: (item.cardNews && item.cardNews.slides && item.cardNews.slides.length) || 0,
    publishDateStr: (state.contentPlans.find(cp=>cp.id==="cp-cn-"+item.id)||{}).dateStr || "",
  }));
  return cols.concat(cards).sort((a,b)=> new Date(b.updatedAt||b.createdAt) - new Date(a.updatedAt||a.createdAt));
}

function libraryItemsToCsv(items){
  const escapeCsv = (v) => `"${String(v==null?"":v).replace(/"/g,'""')}"`;
  const header = ["유형","제목","태그","발행예정일","작성일","수정일"];
  const rows = items.map(it => [
    it.type==="column" ? "칼럼" : "카드뉴스",
    it.title,
    (it.tags||[]).join(" "),
    it.publishDateStr||"",
    it.createdAt ? new Date(it.createdAt).toLocaleDateString("ko-KR") : "",
    it.updatedAt ? new Date(it.updatedAt).toLocaleDateString("ko-KR") : "",
  ]);
  return [header].concat(rows).map(r=>r.map(escapeCsv).join(",")).join("\r\n");
}

function downloadLibraryCsv(){
  const items = filteredLibraryItems();
  const csv = "﻿" + libraryItemsToCsv(items); // BOM 포함 — 엑셀에서 한글 깨짐 방지
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "콘텐츠_라이브러리_" + new Date().toISOString().slice(0,10) + ".csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function libraryStats(items){
  const now = new Date();
  const thisMonthKey = now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
  const thisMonthCount = items.filter(it=>{
    const d = new Date(it.createdAt);
    return !isNaN(d) && (d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")) === thisMonthKey;
  }).length;
  const tagCounts = {};
  items.forEach(it => (it.tags||[]).forEach(t=>{ tagCounts[t] = (tagCounts[t]||0)+1; }));
  const topTags = Object.entries(tagCounts).sort((a,b)=>b[1]-a[1]).slice(0,8);
  return {
    total: items.length,
    columnCount: items.filter(it=>it.type==="column").length,
    cardnewsCount: items.filter(it=>it.type==="cardnews").length,
    thisMonthCount, topTags,
  };
}

function filteredLibraryItems(){
  const q = (state.librarySearch||"").trim().toLowerCase();
  return libraryItems().filter(it=>{
    if(state.libraryTypeFilter!=="all" && it.type!==state.libraryTypeFilter) return false;
    if(state.libraryTagFilter && !(it.tags||[]).includes(state.libraryTagFilter)) return false;
    if(q && !it.title.toLowerCase().includes(q)) return false;
    return true;
  });
}

  const tagsHtml = (it.tags||[]).map(t=>`<span class="badge" style="background:#eef0f4;color:var(--ink);margin:2px 4px 0 0;">#${escapeHtml(t)}</span>`).join("");
  return `

function renderLibraryResultsInner(){
  const filtered = filteredLibraryItems();
  if(filtered.length===0){
    return `<div class="empty-state"><div class="big">🔍</div>저장된 항목이 없거나 검색 결과가 없어요.</div>`;
  }
  return filtered.map(renderLibraryResultRow).join("");
}

function todayDateStr(){
  const d = new Date();
  return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
}
function dateStrPlusDays(n){
  const d = new Date();
  d.setDate(d.getDate()+n);
  return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
}

function renderUpcomingPublishSection(items){
  const today = todayDateStr();
  const until = dateStrPlusDays(7);
  const upcoming = items
    .filter(it => it.publishDateStr && it.publishDateStr >= today && it.publishDateStr <= until)
    .sort((a,b) => a.publishDateStr.localeCompare(b.publishDateStr));
  if(!upcoming.length) return "";
  const rows = upcoming.map(it=>{
    const typeIcon = it.type==="column" ? "📝" : "🖼️";
    const isToday = it.publishDateStr === today;
    return `
      <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);">
        <span class="badge" style="background:${isToday?'#f8e6e4':'#e5f0ec'};color:${isToday?'var(--seal)':'var(--teal)'};flex-shrink:0;">${isToday?"오늘":it.publishDateStr}</span>
        <span style="flex:1;min-width:0;font-size:13px;">${typeIcon} ${escapeHtml(it.title)}</span>
        <button class="btn outline" data-lib-open="${it.type}:${it.id}" style="font-size:11px;padding:4px 10px;flex-shrink:0;">열기 →</button>
      </div>
    `;
  }).join("");
  return `
    <div class="card" style="padding:16px;margin-bottom:16px;border-left:4px solid var(--teal);">
      <div style="font-weight:700;font-size:14px;margin-bottom:4px;">📅 다가오는 발행 일정 (7일 이내)</div>
      ${rows}
    </div>
  `;
}

function bindLibraryResultButtons(){
  document.querySelectorAll("[data-lib-open]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const [type, id] = btn.dataset.libOpen.split(":");
      if(type === "column"){ state.route = "columns"; loadColumnProject(id); }
      else { state.route = "cardnews"; loadCardNewsProject(id); }
    });
  });
  document.querySelectorAll("[data-lib-delete]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const [type, id] = btn.dataset.libDelete.split(":");
      if(type === "column") deleteColumnProject(id);
      else deleteCardNewsProject(id);
    });
  });
}

/* Claude API(웹검색 포함) 호출 — 실제 수치 대신 웹 검색 기반 압축 분석 */
function extractJSONBlock(text){
  const start = text.indexOf("{");
  const end = text.lastIndexOf("}");
  if(start===-1 || end===-1) throw new Error("응답에서 JSON을 찾지 못했어요.");
  return JSON.parse(text.slice(start, end+1));
}

async function analyzeKeywordDemand(product, monthLabel){
  const prompt = `너는 한국 시장을 대상으로 하는 마케팅 데이터 분석가야.
아래 상품/카테고리에 대해 지정된 시기의 국내 수요를 웹 검색으로 조사하고, 아래 JSON 형식으로만 답해. 다른 설명, 코드블록 표시(백틱) 없이 순수 JSON만 출력해.

상품/카테고리: ${product}
분석 시기: ${monthLabel} (한국 기준)

{
  "demandSummary": "이번 달 수요를 2문장 이내로 압축 요약 (계절성, 최근 이슈 등 반영)",
  "momentum": "상승 또는 유지 또는 하락 중 하나",
  "keywords": [
    {"keyword": "실제 검색/언급이 늘고 있는 연관 키워드", "momentum": "상승 또는 유지 또는 하락", "note": "이 키워드가 왜 뜨는지 한 줄 설명"}
  ],
  "suggestions": [
    "지금 바로 실행 가능한 압축된 마케팅 제안 한 줄 (채널·타이밍·메시지 포함)"
  ]
}

keywords는 5~8개, suggestions는 3~5개로 압축해서 작성해.`;

  return await callClaudeJSON(prompt, true);
}

async function runKeywordAnalysis(product){
  state.keywordLoading = true;
  state.currentAnalysisError = null;
  render();
  try{
    const monthLabel = state.calendarYear + "년 " + state.calendarMonth + "월";
    const result = await analyzeKeywordDemand(product, monthLabel);
    state.currentAnalysis = {
      product,
      monthKey: monthKey(state.calendarYear, state.calendarMonth),
      monthLabel,
      ...result,
    };
  }catch(e){
    state.currentAnalysisError = "분석 중 문제가 생겼어요: " + e.message;
  }
  state.keywordLoading = false;
  render();
}

    const SNAP_THRESHOLD = 2.2; // % 단위 — 중앙(50%) 근처에서 이 안쪽으로 들어오면 착 달라붙는다
    function setGuideLine(canvas, axis, show){
      const cls = axis === "v" ? "snap-guide-v" : "snap-guide-h";
      let g = canvas.querySelector("."+cls);
      if(show){
        if(!g){
          g = document.createElement("div");
          g.className = cls;
          g.style.position = "absolute";
          g.style.background = "var(--seal)";
          g.style.zIndex = "50";
          g.style.pointerEvents = "none";
          g.style.opacity = "0.85";
          if(axis === "v"){ g.style.top="0"; g.style.bottom="0"; g.style.left="50%"; g.style.width="1px"; }
          else { g.style.left="0"; g.style.right="0"; g.style.top="50%"; g.style.height="1px"; }
          canvas.appendChild(g);
        }
      } else if(g){ g.remove(); }
    }
    document.querySelectorAll("[data-layer]").forEach(el=>{
      el.addEventListener("pointerdown", (e)=>{
        e.preventDefault();
        const [idxStr, layerId] = el.dataset.layer.split(":");
        const idx = Number(idxStr);
        const canvas = el.closest("[data-card-canvas]");
        if(!canvas) return;
        const rect = canvas.getBoundingClientRect();
        if(!rect.width || !rect.height) return; // 레이아웃 정보가 없으면(예: 헤드리스 환경) 드래그 생략
        const slide = state.cardPipeline.cardNews && state.cardPipeline.cardNews.slides[idx];
        if(!slide) return;
        const layer = (slide.layers||[]).find(l=>l.id===layerId);
        if(!layer) return;
        const startX = e.clientX, startY = e.clientY;
        const startLayerX = layer.x, startLayerY = layer.y;
        try{ el.setPointerCapture(e.pointerId); }catch(err){}

        function onMove(ev){
          const dxPercent = ((ev.clientX - startX) / rect.width) * 100;
          const dyPercent = ((ev.clientY - startY) / rect.height) * 100;
          let nx = Math.max(5, Math.min(95, startLayerX + dxPercent));
          let ny = Math.max(5, Math.min(95, startLayerY + dyPercent));
          const snappedX = Math.abs(nx - 50) < SNAP_THRESHOLD;
          const snappedY = Math.abs(ny - 50) < SNAP_THRESHOLD;
          if(snappedX) nx = 50;
          if(snappedY) ny = 50;
          layer.x = nx; layer.y = ny;
          el.style.left = nx + "%";
          el.style.top = ny + "%";
          setGuideLine(canvas, "v", snappedX);
          setGuideLine(canvas, "h", snappedY);
        }
        function onUp(){
          el.removeEventListener("pointermove", onMove);
          el.removeEventListener("pointerup", onUp);
          try{ el.releasePointerCapture(e.pointerId); }catch(err){}
          setGuideLine(canvas, "v", false);
          setGuideLine(canvas, "h", false);
          if(layer.type === "subtext") slide.autoFlowSubtext = false; // 직접 옮겼으니 이제부터는 자동 재배치하지 않음
          if(state.cardEditor) state.cardEditor.selectedLayer = layerId;
          render();
        }
        el.addEventListener("pointermove", onMove);
        el.addEventListener("pointerup", onUp);
      });
      el.addEventListener("dblclick", (e)=>{
        e.preventDefault();
        const [idxStr, layerId] = el.dataset.layer.split(":");
        const idx = Number(idxStr);
        const slide = state.cardPipeline.cardNews && state.cardPipeline.cardNews.slides[idx];

        if(!state.cardEditor) return;
        state.cardEditor.selectedLayer = layerId;
        state.cardEditor.editingLayer = layerId;
        render();
      });
    });

    document.querySelectorAll("[data-resize-handle]").forEach(handle=>{
      handle.addEventListener("pointerdown", (e)=>{
        e.preventDefault(); e.stopPropagation();
        const [idxStr, layerId] = handle.dataset.resizeHandle.split(":");
        const idx = Number(idxStr);
        const canvas = handle.closest("[data-card-canvas]");
        if(!canvas) return;
        const rect = canvas.getBoundingClientRect();
        if(!rect.width || !rect.height) return;
        const slide = state.cardPipeline.cardNews && state.cardPipeline.cardNews.slides[idx];
        if(!slide) return;
        const layer = (slide.layers||[]).find(l=>l.id===layerId);
        if(!layer || layer.wFrac==null) return;
        const startX = e.clientX;
        const startWFrac = layer.wFrac;
        const aspect = layer.aspect || 1.25;
        const imgEl = canvas.querySelector(`img[data-layer="${idx}:${layerId}"]`);
        try{ handle.setPointerCapture(e.pointerId); }catch(err){}

        function onMove(ev){
          const dxFrac = (ev.clientX - startX) / rect.width;
          const newWFrac = Math.max(0.08, Math.min(1.4, startWFrac + dxFrac));
          const newHFrac = newWFrac * (rect.width/rect.height) * aspect;
          layer.wFrac = newWFrac; layer.hFrac = newHFrac;
          const pxW = newWFrac * rect.width, pxH = newHFrac * rect.height;
          if(imgEl){ imgEl.style.width = Math.round(pxW)+"px"; imgEl.style.height = Math.round(pxH)+"px"; }
          const cx = (layer.x/100) * rect.width, cy = (layer.y/100) * rect.height;
          handle.style.left = Math.round(cx + pxW/2) + "px";
          handle.style.top = Math.round(cy + pxH/2) + "px";
        }
        function onUp(){
          handle.removeEventListener("pointermove", onMove);
          handle.removeEventListener("pointerup", onUp);
          try{ handle.releasePointerCapture(e.pointerId); }catch(err){}
          render();
        }
        handle.addEventListener("pointermove", onMove);
        handle.addEventListener("pointerup", onUp);
      });
    });
    document.querySelectorAll("[data-text-resize-handle]").forEach(handle=>{
      handle.addEventListener("pointerdown", (e)=>{
        e.preventDefault(); e.stopPropagation();
        const [idxStr, layerId] = handle.dataset.textResizeHandle.split(":");
        const idx = Number(idxStr);
        const canvas = handle.closest("[data-card-canvas]");
        if(!canvas) return;
        const rect = canvas.getBoundingClientRect();
        if(!rect.width || !rect.height) return;
        const slide = state.cardPipeline.cardNews && state.cardPipeline.cardNews.slides[idx];
        if(!slide) return;
        const layer = (slide.layers||[]).find(l=>l.id===layerId);
        if(!layer) return;
        const isCover = idx === 0;
        const isCta = idx === (state.cardPipeline.cardNews.slides.length - 1);
        const textEl = canvas.querySelector(`div[data-layer="${idx}:${layerId}"]`);
        const startY = e.clientY;
        const startScale = layer.scale || 1;
        const baseSize = baseFontSizeForType(layer.type, rect.width, isCover, isCta);
        try{ handle.setPointerCapture(e.pointerId); }catch(err){}

        function onMove(ev){
          // 아래로 끌면 커지고 위로 끌면 작아지도록: 세로 이동 거리를 스케일 변화량으로 환산
          const dy = ev.clientY - startY;
          const deltaScale = dy / (rect.height * 0.35);
          let nextScale = Math.max(0.3, Math.min(6, startScale + deltaScale));
          layer.scale = Math.round(nextScale * 100) / 100;
          const newFontSize = Math.round(baseSize * layer.scale);
          if(textEl){
            textEl.style.fontSize = newFontSize + "px";
            const newRect = textEl.getBoundingClientRect();
            const left = newRect.right - rect.left;
            const top = newRect.bottom - rect.top;
            handle.style.left = Math.round(left) + "px";
            handle.style.top = Math.round(top) + "px";
          }
        }
        function onUp(){
          handle.removeEventListener("pointermove", onMove);
          handle.removeEventListener("pointerup", onUp);
          try{ handle.releasePointerCapture(e.pointerId); }catch(err){}
          render();
        }
        handle.addEventListener("pointermove", onMove);
        handle.addEventListener("pointerup", onUp);
      });
    });

        try{
          const src = await tryConvertToDataURL(picked.full);
          await addToImageLibrary(src, picked.title || "검색 이미지");
          render();
        }catch(e){ alert("보관함에 저장하지 못했어요: " + e.message); render(); }
      });
    });
    document.querySelectorAll("[data-image-library-pick]").forEach(el=>{
      el.addEventListener("click", async ()=>{
        const ed = state.cardEditor;
        const is = ed && ed.imageSearch;
        if(!is) return;
        const item = state.imageLibrary.find(i=>i.id === el.dataset.imageLibraryPick);
        if(!item) return;
        const idx = ed.slideIdx;
        const slide = state.cardPipeline.cardNews && state.cardPipeline.cardNews.slides[idx];
        if(!slide) return;
        const purpose = is.purpose;
        ed.imageSearch = null;
        render();
        if(purpose === "bg"){
          slide.bgImage = item.dataUrl;
        } else {
          const dims = await loadImageDims(item.dataUrl).catch(()=>({naturalWidth:1,naturalHeight:1.25}));
          const newLayer = makeImageLayer(item.dataUrl, dims.naturalWidth, dims.naturalHeight);
          if(!slide.layers) slide.layers = [];
          slide.layers.push(newLayer);
          ed.selectedLayer = newLayer.id;
        }
        render();
      });
    });
    document.querySelectorAll("[data-image-library-remove]").forEach(btn=>{
      btn.addEventListener("click", (e)=>{
        e.stopPropagation();
        if(!confirm("보관함에서 이 이미지를 삭제할까요?")) return;
        removeFromImageLibrary(btn.dataset.imageLibraryRemove);
        render();
      });
    });
    const imageLibraryUploadInput = document.getElementById("image-library-upload-input");
    if(imageLibraryUploadInput){
      imageLibraryUploadInput.addEventListener("change", async ()=>{
        const file = imageLibraryUploadInput.files && imageLibraryUploadInput.files[0];
        if(!file) return;
        try{
          const dataUrl = await readFileAsDataURL(file);
          await addToImageLibrary(dataUrl, file.name);
          render();
        }catch(e){ alert("이미지를 불러오지 못했어요: " + e.message); }
      });
    }
    document.querySelectorAll("[data-open-chart-builder]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        if(!state.cardEditor) return;
        state.cardEditor.chartBuilder = { open:true, chartType:"bar", title:"", rows:[{label:"",value:""},{label:"",value:""}], error:"" };
        render();
      });
    });
    const chartBuilderCloseBtn = document.getElementById("chart-builder-close-btn");
    if(chartBuilderCloseBtn) chartBuilderCloseBtn.addEventListener("click", ()=>{
      if(state.cardEditor) state.cardEditor.chartBuilder = null;
      render();
    });
    const chartBuilderTypeSel = document.getElementById("chart-builder-type");
    if(chartBuilderTypeSel) chartBuilderTypeSel.addEventListener("change", ()=>{
      const cb = state.cardEditor && state.cardEditor.chartBuilder;
      if(cb) cb.chartType = chartBuilderTypeSel.value;
    });
    const chartBuilderTitleInput = document.getElementById("chart-builder-title");
    if(chartBuilderTitleInput) chartBuilderTitleInput.addEventListener("input", ()=>{
      const cb = state.cardEditor && state.cardEditor.chartBuilder;
      if(cb) cb.title = chartBuilderTitleInput.value;
    });
    document.querySelectorAll("[data-chart-row-label]").forEach(inp=>{
      inp.addEventListener("input", ()=>{
        const ri = Number(inp.dataset.chartRowLabel);
        const cb = state.cardEditor && state.cardEditor.chartBuilder;
        if(cb && cb.rows[ri]) cb.rows[ri].label = inp.value;
      });
    });
    document.querySelectorAll("[data-chart-row-value]").forEach(inp=>{
      inp.addEventListener("input", ()=>{
        const ri = Number(inp.dataset.chartRowValue);
        const cb = state.cardEditor && state.cardEditor.chartBuilder;
        if(cb && cb.rows[ri]) cb.rows[ri].value = inp.value;
      });
    });
    document.querySelectorAll("[data-chart-row-remove]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const ri = Number(btn.dataset.chartRowRemove);
        const cb = state.cardEditor && state.cardEditor.chartBuilder;
        if(cb && cb.rows.length>1){ cb.rows.splice(ri,1); render(); }
      });
    });
    const chartAddRowBtn = document.getElementById("chart-builder-add-row-btn");
    if(chartAddRowBtn) chartAddRowBtn.addEventListener("click", ()=>{
      const cb = state.cardEditor && state.cardEditor.chartBuilder;
      if(cb){ cb.rows.push({label:"",value:""}); render(); }
    });
    const chartBuilderAddBtn = document.getElementById("chart-builder-add-btn");
    if(chartBuilderAddBtn) chartBuilderAddBtn.addEventListener("click", addChartLayerFromBuilder);
    document.querySelectorAll("[data-table-row-label]").forEach(inp=>{
      inp.addEventListener("change", ()=>{
        const [idxStr, layerId, riStr] = inp.dataset.tableRowLabel.split(":");
        const slide = state.cardPipeline.cardNews && state.cardPipeline.cardNews.slides[Number(idxStr)];
        const layer = slide && (slide.layers||[]).find(l=>l.id===layerId);
        if(layer && layer.rows && layer.rows[Number(riStr)]) layer.rows[Number(riStr)].label = inp.value;
      });
    });
    document.querySelectorAll("[data-table-row-value]").forEach(inp=>{
      inp.addEventListener("change", ()=>{
        const [idxStr, layerId, riStr] = inp.dataset.tableRowValue.split(":");
        const slide = state.cardPipeline.cardNews && state.cardPipeline.cardNews.slides[Number(idxStr)];
        const layer = slide && (slide.layers||[]).find(l=>l.id===layerId);
        if(layer && layer.rows && layer.rows[Number(riStr)]) layer.rows[Number(riStr)].value = inp.value;
      });
    });
    document.querySelectorAll("[data-table-row-remove]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const [idxStr, layerId, riStr] = btn.dataset.tableRowRemove.split(":");
        const slide = state.cardPipeline.cardNews && state.cardPipeline.cardNews.slides[Number(idxStr)];
        const layer = slide && (slide.layers||[]).find(l=>l.id===layerId);
        if(layer && layer.rows && layer.rows.length>1){ layer.rows.splice(Number(riStr),1); render(); }
      });
    });
    document.querySelectorAll("[data-table-row-add]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const [idxStr, layerId] = btn.dataset.tableRowAdd.split(":");
        const slide = state.cardPipeline.cardNews && state.cardPipeline.cardNews.slides[Number(idxStr)];
        const layer = slide && (slide.layers||[]).find(l=>l.id===layerId);
        if(layer){ if(!layer.rows) layer.rows = []; layer.rows.push({label:"",value:""}); render(); }
      });
    });
    const downloadAllBtn = document.getElementById("download-all-cards-btn");
    if(downloadAllBtn) downloadAllBtn.addEventListener("click", downloadAllCardsZip);
    const uploadCardNewsNotionBtn = document.getElementById("upload-cardnews-notion-btn");
    if(uploadCardNewsNotionBtn) uploadCardNewsNotionBtn.addEventListener("click", runCardNewsNotionUpload);
    const copyCardNewsBtn = document.getElementById("copy-cardnews-btn");
    if(copyCardNewsBtn) copyCardNewsBtn.addEventListener("click", ()=>{
      const cn = state.cardPipeline.cardNews;
      if(!cn) return;
      copyTextToClipboard(cardNewsSlidesToText(cn.slides), copyCardNewsBtn);
    });
    applyDynamicFlowToVisibleCards();
  }
  if(state.route === "library"){
    const libSearchInput = document.getElementById("lib-search-input");
    if(libSearchInput) libSearchInput.addEventListener("input", ()=>{
      state.librarySearch = libSearchInput.value;
      const resultsEl = document.getElementById("lib-results");
      if(resultsEl){ resultsEl.innerHTML = renderLibraryResultsInner(); bindLibraryResultButtons(); }
    });
    document.querySelectorAll("[data-lib-type-filter]").forEach(btn=>{
      btn.addEventListener("click", ()=>{ state.libraryTypeFilter = btn.dataset.libTypeFilter; render(); });
    });
    document.querySelectorAll("[data-lib-tag-filter]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const t = btn.dataset.libTagFilter;
        state.libraryTagFilter = (t && t !== state.libraryTagFilter) ? t : null;
        render();
      });
    });
    const libExportCsvBtn = document.getElementById("lib-export-csv-btn");
    if(libExportCsvBtn) libExportCsvBtn.addEventListener("click", downloadLibraryCsv);
    bindLibraryResultButtons();
  }
  if(state.route === "keywords"){
    const runBtn = document.getElementById("run-analysis-btn");
    if(runBtn) runBtn.addEventListener("click", async ()=>{
      const product = document.getElementById("trend-product").value;
      if(!product){ alert("상품을 선택해주세요."); return; }
      await runKeywordAnalysis(product);
    });
    const saveBtn = document.getElementById("save-analysis-btn");
    if(saveBtn) saveBtn.addEventListener("click", saveCurrentAnalysis);
  }
  if(state.route === "settings"){
    const gotoColumnsBtn = document.getElementById("goto-columns-btn");
    if(gotoColumnsBtn) gotoColumnsBtn.addEventListener("click", ()=>{
      state.route = "columns";
      state.columnsSettingsOpen = true;
      render();
    });
    const gotoCardNewsBtn = document.getElementById("goto-cardnews-btn");
    if(gotoCardNewsBtn) gotoCardNewsBtn.addEventListener("click", ()=>{
      state.route = "cardnews";
      state.cardSettingsOpen = true;
      render();
    });
    const reloadBtn = document.getElementById("reload-products-btn");
    if(reloadBtn) reloadBtn.addEventListener("click", async ()=>{
      const p = await window.storage.get("products", false);
      if(p && p.value) state.products = JSON.parse(p.value);
      render();
    });
    const exportBtn = document.getElementById("export-btn");
    if(exportBtn) exportBtn.addEventListener("click", ()=>{
      const snapshot = { campaigns: state.campaigns, adSpends: state.adSpends, contentIdeas: state.contentIdeas, keywordTrends: state.keywordTrends };
      const blob = new Blob([JSON.stringify(snapshot,null,2)], {type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "marketing-snapshot.json"; a.click();
    });
  }
}

function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

guardSessionThenStart();
</script>
</body>
</html>
