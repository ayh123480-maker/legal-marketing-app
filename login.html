<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>로그인 · 법률 마케팅 도구</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root{ --paper:#f2f1ec; --ink:#1c2b45; --amber:#8a5a2b; --line:#d8d5c8; --seal:#b5342a; }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--paper); color:var(--ink); font-family:'Noto Sans KR', sans-serif;
  }
  .box{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:32px; width:340px; max-width:90vw; }
  .box h1{ font-family:'Noto Serif KR', serif; font-size:19px; margin:0 0 4px 0; }
  .box p{ font-size:12px; opacity:0.6; margin:0 0 20px 0; }
  input{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:6px;
    font-size:14px; margin-bottom:12px; font-family:inherit;
  }
  button{
    width:100%; padding:10px 12px; border:none; border-radius:6px; background:var(--ink);
    color:#fff; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  button:disabled{ opacity:0.6; cursor:default; }
  .error{ font-size:12px; color:var(--seal); margin:-4px 0 12px 0; min-height:14px; }
</style>
</head>
<body>
  <div class="box">
    <h1>법률 마케팅 도구</h1>
    <p>팀 공유 비밀번호를 입력하세요</p>
    <input type="password" id="password" placeholder="비밀번호" autofocus />
    <div class="error" id="error"></div>
    <button id="login-btn">로그인</button>
  </div>

<script>
  const passwordInput = document.getElementById("password");
  const errorBox = document.getElementById("error");
  const loginBtn = document.getElementById("login-btn");

  async function doLogin(){
    const password = passwordInput.value;
    if(!password){ errorBox.textContent = "비밀번호를 입력해주세요."; return; }
    loginBtn.disabled = true; loginBtn.textContent = "확인 중...";
    errorBox.textContent = "";
    try{
      const res = await fetch("/api/login", {
        method:"POST", headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ password })
      });
      const data = await res.json();
      if(res.ok && data.ok){
        window.location.href = "/index.html";
      } else {
        errorBox.textContent = data.error || "로그인에 실패했어요.";
      }
    }catch(e){
      errorBox.textContent = "서버 요청 중 오류가 발생했어요: " + e.message;
    }
    loginBtn.disabled = false; loginBtn.textContent = "로그인";
  }

  loginBtn.addEventListener("click", doLogin);
  passwordInput.addEventListener("keydown", (e)=>{ if(e.key === "Enter") doLogin(); });
</script>
</body>
</html>
